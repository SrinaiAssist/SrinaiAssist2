<!DOCTYPE html>
<html lang="id">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jadwal - SRINAI ASSIST</title>
<script src="js/auth.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#001F54;}
.container{max-width:600px;margin:auto;min-height:100vh;background:#001F54;padding-bottom:100px;}
.header{background:#4DA6FF;color:white;text-align:center;padding:20px;}
.content{padding:15px;}

.card{background:#FFD54F;border-radius:16px;padding:12px 12px 16px;margin-bottom:15px;}
.card h2{text-align:center;margin-bottom:12px;font-size:20px;letter-spacing:1px;}

.petugas-row{margin-bottom:10px;}
.petugas-row label{display:block;font-weight:bold;margin-bottom:4px;font-size:13px;}
.petugas-row input{width:100%;padding:9px 10px;border:none;border-radius:8px;font-weight:bold;}

.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap;}
.toolbar select{padding:8px;border:none;border-radius:8px;font-weight:bold;}
.toolbar button{padding:9px 12px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;color:white;}
.btn-pdf{background:#2E7D32;}
.btn-clear{background:#D32F2F;}
.hint{font-size:11px;color:#5a4300;margin:-6px 0 10px;}

.table-wrap{overflow-x:auto;background:white;border-radius:12px;padding:6px;-webkit-overflow-scrolling:touch;}
table#jadwalTable{border-collapse:collapse;width:100%;}
table#jadwalTable th, table#jadwalTable td{
  border:1px solid #cfd8dc;
  text-align:center;
  font-size:13px;
  padding:0;
}
table#jadwalTable th{
  background:#1565C0;color:white;padding:6px 4px;font-size:12px;white-space:nowrap;
  position:sticky;top:0;z-index:2;
}
.col-tanggal{width:40px;min-width:40px;}
.col-hari{width:78px;min-width:78px;}
.col-cell{width:30px;min-width:30px;}

td.tanggal-cell{font-weight:bold;background:#eef3fb;color:#001F54;cursor:pointer;user-select:none;}
td[contenteditable="true"]{
  min-width:100%;
  height:34px;
  line-height:34px;
  outline:none;
  cursor:text;
}
td.hari-cell:empty::before{content:"-";color:#b0bec5;}
td[contenteditable="true"]:focus{background:#FFF3CD;}

/* Tanggal merah / libur: ditandai manual dengan ketuk sel tanggal */
tr.row-libur td.tanggal-cell{background:#D32F2F;color:#fff;}
tr.row-libur td.hari-cell,
tr.row-libur td.cell-num{background:#ffebee;color:#c62828;pointer-events:none;opacity:.65;}

.jadwal-card{background:white;padding:15px;border-radius:15px;margin-bottom:12px;}
.jadwal-card h3{color:#1565C0;margin-bottom:8px;}
.status{font-weight:bold;margin-top:8px;}
.action{display:flex;gap:10px;margin-top:10px;}
.edit-btn{flex:1;padding:10px;border:none;border-radius:8px;background:#4DA6FF;color:white;cursor:pointer;}
.delete-btn{flex:1;padding:10px;border:none;border-radius:8px;background:#D32F2F;color:white;cursor:pointer;}

.bottom-menu{position:fixed;bottom:0;left:0;right:0;background:#001F54;padding:12px;text-align:center;}
.back-btn{background:#FFD54F;color:black;padding:14px 25px;border-radius:25px;text-decoration:none;font-weight:bold;display:inline-block;}

#saveInfo{color:white;text-align:center;font-size:12px;margin-top:8px;opacity:.8;}
</style>
</head>
<body>

<div class="container">

<div class="header">
  <h1>JADWAL INSPEKSI</h1>
  <p id="userInfo"></p>
</div>

<div class="content">

  <div class="card">
    <h2>JADWAL</h2>

    <div class="petugas-row">
      <label>Nama Petugas</label>
      <input type="text" id="namaPetugas" placeholder="Nama petugas...">
    </div>

    <div class="toolbar">
      <select id="bulanSelect"></select>
      <select id="tahunSelect"></select>
      <button class="btn-pdf" onclick="downloadPDF()">Download PDF</button>
      <button class="btn-clear" onclick="kosongkanTabel()">Kosongkan</button>
    </div>
    <div class="hint">Ketuk sel Hari / kolom kecil untuk mengisi. Ketuk angka pada kolom Tgl untuk menandai tanggal merah (libur) — sel di baris itu jadi terkunci &amp; berwarna merah. Semua tersimpan otomatis per bulan.</div>

    <div class="table-wrap">
      <table id="jadwalTable">
        <thead>
          <tr>
            <th class="col-tanggal">Tgl</th>
            <th class="col-hari">Hari</th>
            <th class="col-cell">1</th><th class="col-cell">2</th><th class="col-cell">3</th>
            <th class="col-cell">4</th><th class="col-cell">5</th><th class="col-cell">6</th>
            <th class="col-cell">7</th><th class="col-cell">8</th><th class="col-cell">9</th>
            <th class="col-cell">10</th><th class="col-cell">11</th><th class="col-cell">12</th>
          </tr>
        </thead>
        <tbody id="jadwalTableBody"></tbody>
      </table>
    </div>

    <div id="saveInfo"></div>
  </div>

</div>

</div>

<div class="bottom-menu">
  <a href="dashboard.html" class="back-btn">← Kembali ke Dashboard</a>
</div>

<script>
if(!isLoggedIn()){
  location.href="index.html";
}

const currentUser = getCurrentUser();
document.getElementById("userInfo").innerHTML = currentUser;

const JUMLAH_TANGGAL = 28;
const JUMLAH_KOLOM   = 12;
const NAMA_BULAN = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];

const bulanSelect  = document.getElementById("bulanSelect");
const tahunSelect  = document.getElementById("tahunSelect");
const tbody        = document.getElementById("jadwalTableBody");
const saveInfo      = document.getElementById("saveInfo");
const namaPetugasEl = document.getElementById("namaPetugas");

// Isi dropdown bulan & tahun
NAMA_BULAN.forEach((nama, i)=>{
  const opt = document.createElement("option");
  opt.value = i;
  opt.textContent = nama;
  bulanSelect.appendChild(opt);
});
const now = new Date();
for(let y = now.getFullYear() - 1; y <= now.getFullYear() + 1; y++){
  const opt = document.createElement("option");
  opt.value = y;
  opt.textContent = y;
  tahunSelect.appendChild(opt);
}
bulanSelect.value = now.getMonth();
tahunSelect.value = now.getFullYear();

function storageKey(){
  return "jadwalTabel_" + tahunSelect.value + "_" + bulanSelect.value;
}

// Bangun 28 baris: kolom Tanggal (1-28) terisi & bisa diketuk untuk tandai libur,
// kolom Hari & 12 kolom kosong dan bisa diisi manual.
function buildTable(){
  tbody.innerHTML = "";
  for(let tgl = 1; tgl <= JUMLAH_TANGGAL; tgl++){
    const tr = document.createElement("tr");
    tr.dataset.tanggal = tgl;

    const tdTanggal = document.createElement("td");
    tdTanggal.className = "tanggal-cell";
    tdTanggal.textContent = tgl;
    tdTanggal.title = "Ketuk untuk tandai tanggal merah / libur";
    tdTanggal.addEventListener("click", ()=> toggleLibur(tr));
    tr.appendChild(tdTanggal);

    const tdHari = document.createElement("td");
    tdHari.className = "hari-cell";
    tdHari.setAttribute("contenteditable", "true");
    tdHari.dataset.col = "hari";
    tr.appendChild(tdHari);

    for(let k = 1; k <= JUMLAH_KOLOM; k++){
      const tdCell = document.createElement("td");
      tdCell.className = "cell-num";
      tdCell.setAttribute("contenteditable", "true");
      tdCell.dataset.col = "c" + k;
      tr.appendChild(tdCell);
    }

    tbody.appendChild(tr);
  }
}

// Tandai / batalkan tanggal merah (libur) untuk satu baris.
// Saat ditandai libur: isi Hari & 12 kolom dikosongkan dan dikunci (tak dapat diisi).
function toggleLibur(tr){
  const jadiLibur = !tr.classList.contains("row-libur");
  tr.classList.toggle("row-libur", jadiLibur);

  const tdHari = tr.querySelector('[data-col="hari"]');
  tdHari.setAttribute("contenteditable", jadiLibur ? "false" : "true");
  if(jadiLibur) tdHari.textContent = "";

  for(let k = 1; k <= JUMLAH_KOLOM; k++){
    const tdCell = tr.querySelector('[data-col="c'+k+'"]');
    tdCell.setAttribute("contenteditable", jadiLibur ? "false" : "true");
    if(jadiLibur) tdCell.textContent = "";
  }
  simpanTabel();
}

// Simpan seluruh isi tabel + nama petugas bulan yang sedang aktif ke localStorage
function simpanTabel(){
  const data = { petugas: namaPetugasEl.value.trim(), hari: [], cells: [], libur: [] };
  tbody.querySelectorAll("tr").forEach(tr=>{
    data.hari.push(tr.querySelector('[data-col="hari"]').textContent.trim());
    data.libur.push(tr.classList.contains("row-libur"));
    const baris = [];
    for(let k = 1; k <= JUMLAH_KOLOM; k++){
      baris.push(tr.querySelector('[data-col="c'+k+'"]').textContent.trim());
    }
    data.cells.push(baris);
  });
  localStorage.setItem(storageKey(), JSON.stringify(data));
  saveInfo.textContent = "Tersimpan " + new Date().toLocaleTimeString("id-ID");
}

// Muat isi tabel + nama petugas bulan yang sedang aktif dari localStorage
function muatTabel(){
  buildTable();
  namaPetugasEl.value = "";
  const raw = localStorage.getItem(storageKey());
  if(raw){
    try{
      const data = JSON.parse(raw);
      namaPetugasEl.value = data.petugas || "";
      const rows = tbody.querySelectorAll("tr");
      rows.forEach((tr, i)=>{
        if(data.libur && data.libur[i]){
          toggleLibur(tr); // langsung terapkan kunci + tampilan merah
          return; // baris libur tidak perlu diisi hari/kolomnya
        }
        if(data.hari && data.hari[i]) tr.querySelector('[data-col="hari"]').textContent = data.hari[i];
        for(let k = 1; k <= JUMLAH_KOLOM; k++){
          const val = data.cells && data.cells[i] ? data.cells[i][k-1] : "";
          if(val) tr.querySelector('[data-col="c'+k+'"]').textContent = val;
        }
      });
      saveInfo.textContent = "Data bulan ini dimuat dari penyimpanan.";
    }catch(e){
      saveInfo.textContent = "Data tersimpan rusak, dimulai dari kosong.";
    }
  } else {
    saveInfo.textContent = "Belum ada data tersimpan untuk bulan ini.";
  }
}

function kosongkanTabel(){
  if(!confirm("Kosongkan seluruh isi tabel (termasuk nama petugas) untuk bulan ini?")) return;
  localStorage.removeItem(storageKey());
  muatTabel();
}

// Simpan otomatis tiap kali ada perubahan di sel manapun (debounce ringan)
let saveTimer = null;
document.addEventListener("input", (e)=>{
  if(!e.target.matches('[contenteditable="true"]')) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(simpanTabel, 400);
});
namaPetugasEl.addEventListener("input", ()=>{
  clearTimeout(saveTimer);
  saveTimer = setTimeout(simpanTabel, 400);
});

bulanSelect.addEventListener("change", muatTabel);
tahunSelect.addEventListener("change", muatTabel);

/* =========================================================
   DOWNLOAD PDF — digambar manual pakai primitive jsPDF
   (sama seperti pola dipakai di catatan-span.html / catatan.html)
========================================================= */
function downloadPDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: "landscape", unit: "mm", format: "a4" });

  const bulanLabel = NAMA_BULAN[bulanSelect.value] + " " + tahunSelect.value;
  const petugas = namaPetugasEl.value.trim() || "-";

  // ── Judul & info ──
  doc.setFont("helvetica", "bold");
  doc.setFontSize(16);
  doc.text("JADWAL", 148.5, 15, { align: "center" });

  doc.setFontSize(10);
  doc.setFont("helvetica", "normal");
  doc.text("Bulan", 15, 24);
  doc.text(": " + bulanLabel, 32, 24);
  doc.text("Nama Petugas", 15, 30);
  doc.text(": " + petugas, 32, 30);

  // ── Ukuran grid ──
  const startX = 15, startY = 36;
  const colTgl = 12, colHari = 30, colKecil = 19;
  const rowH = 5.6, headH = 7;
  const totalW = colTgl + colHari + colKecil * JUMLAH_KOLOM;

  // Header kolom
  doc.setFillColor(21, 101, 192);
  doc.setTextColor(255, 255, 255);
  doc.setDrawColor(120, 120, 120);
  doc.setFontSize(9);
  doc.setFont("helvetica", "bold");

  let x = startX;
  const headerLabels = ["Tgl", "Hari"];
  for(let k = 1; k <= JUMLAH_KOLOM; k++) headerLabels.push(String(k));
  const widths = [colTgl, colHari, ...Array(JUMLAH_KOLOM).fill(colKecil)];

  headerLabels.forEach((label, i)=>{
    doc.rect(x, startY, widths[i], headH, "FD");
    doc.text(label, x + widths[i]/2, startY + headH/2 + 1.3, { align: "center" });
    x += widths[i];
  });

  // Baris data
  doc.setFont("helvetica", "normal");
  const rows = tbody.querySelectorAll("tr");
  let y = startY + headH;

  rows.forEach(tr=>{
    const isLibur = tr.classList.contains("row-libur");
    const tanggal = tr.querySelector(".tanggal-cell").textContent.trim();
    const hari    = tr.querySelector('[data-col="hari"]').textContent.trim();
    const cells   = [];
    for(let k = 1; k <= JUMLAH_KOLOM; k++){
      cells.push(tr.querySelector('[data-col="c'+k+'"]').textContent.trim());
    }
    const values = [tanggal, hari, ...cells];

    x = startX;
    values.forEach((val, i)=>{
      if(isLibur){
        doc.setFillColor(255, 205, 210);
        doc.setTextColor(198, 40, 40);
        doc.rect(x, y, widths[i], rowH, "FD");
      } else {
        doc.setTextColor(0, 0, 0);
        doc.rect(x, y, widths[i], rowH);
      }
      if(val) doc.text(String(val), x + widths[i]/2, y + rowH/2 + 1.2, { align: "center" });
      x += widths[i];
    });

    y += rowH;

    // Pindah ke halaman baru kalau tabel kepanjangan (jaga-jaga)
    if(y > 200 && tanggal != JUMLAH_TANGGAL){
      doc.addPage("a4", "landscape");
      y = 20;
    }
  });

  const namaFile = "Jadwal_" + bulanLabel.replace(" ", "_") + ".pdf";
  doc.save(namaFile);
  saveInfo.textContent = "PDF diunduh: " + namaFile;
}

muatTabel();
</script>

</body>
</html>
