<!DOCTYPE html>
<html lang="id" class="theme-fieldlog">
<head>
  <meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0B1220">
<link rel="icon" href="/assets/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
<title>Log Login - SRINAI ASSIST</title>
<script src="js/auth.js"></script>
<script src="js/sync.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-deep:   #080F1E;
  --bg-card:   #0D1830;
  --bg-card2:  #111E35;
  --bg-glass:  rgba(255,255,255,0.06);
  --border:    rgba(255,255,255,0.09);
  --gold:      #F4C542;
  --gold-dim:  rgba(244,197,66,0.15);
  --blue:      #4A8EF5;
  --blue-glow: rgba(74,142,245,0.25);
  --teal:      #38BFA0;
  --ink:    #FFFFFF;
  --ink-2:  rgba(255,255,255,0.65);
  --ink-3:  rgba(255,255,255,0.38);
  --green:     #2DD4A0;
  --green-bg:  rgba(45,212,160,0.15);
  --amber:     #F4C542;
  --amber-bg:  rgba(244,197,66,0.12);
  --red:       #F26B6B;
  --red-bg:    rgba(242,107,107,0.13);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:'Plus Jakarta Sans',Arial,sans-serif;
  background:var(--bg-deep);color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
.container{
  max-width:460px;margin:auto;min-height:100vh;
  background:var(--bg-deep);padding-bottom:40px;
  position:relative;overflow-x:hidden;
}
.bg-glow{
  position:fixed;top:0;left:0;right:0;max-width:460px;margin:auto;
  height:300px;
  background:radial-gradient(ellipse 80% 60% at 50% 0%, rgba(74,142,245,0.13) 0%, transparent 70%);
  pointer-events:none;z-index:0;
}
.topbar{
  position:relative;z-index:2;
  display:flex;align-items:center;gap:12px;
  padding:20px 20px 0;
}
.back-btn{
  width:38px;height:38px;border-radius:12px;flex-shrink:0;
  background:var(--bg-glass);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;text-decoration:none;
}
.topbar-title{flex:1;}
.topbar-title h1{font-size:17px;font-weight:800;color:var(--ink);letter-spacing:-0.3px;}
.topbar-title p{font-size:11px;color:var(--ink-3);margin-top:2px;}
.refresh-btn{
  width:38px;height:38px;border-radius:12px;flex-shrink:0;
  background:var(--bg-glass);border:1px solid var(--border);color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;
}

.summary-row{
  position:relative;z-index:2;display:flex;gap:10px;margin:18px 20px 0;
}
.summary-chip{
  flex:1;background:var(--bg-card);border:1px solid var(--border);border-radius:14px;
  padding:12px;text-align:center;
}
.summary-chip .num{font-size:19px;font-weight:800;color:var(--gold);}
.summary-chip .lbl{font-size:10px;color:var(--ink-3);margin-top:2px;text-transform:uppercase;letter-spacing:.5px;}

.section-label{
  position:relative;z-index:2;
  font-size:10px;font-weight:700;color:var(--ink-3);
  text-transform:uppercase;letter-spacing:.8px;
  display:flex;align-items:center;gap:6px;
  margin:22px 20px 10px;
}
.section-label::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--blue);display:block;}

.list-wrap{padding:0 20px;position:relative;z-index:2;}
.log-card{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:18px;padding:14px 15px;margin-bottom:10px;
  box-shadow:0 4px 16px rgba(0,0,0,0.25);
  display:flex;align-items:center;gap:12px;cursor:pointer;
}
.log-avatar{
  width:42px;height:42px;border-radius:13px;flex-shrink:0;
  background:var(--blue-glow);border:1px solid rgba(74,142,245,0.22);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:14px;color:var(--blue);overflow:hidden;
}
.log-avatar img{width:100%;height:100%;object-fit:cover;border-radius:13px;}
.log-info{flex:1;min-width:0;}
.log-name{font-size:14px;font-weight:800;color:var(--ink);}
.log-badges{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap;}
.badge{font-size:9.5px;font-weight:700;padding:2.5px 8px;border-radius:20px;white-space:nowrap;}
.badge-role{background:var(--blue-glow);color:var(--blue);border:1px solid rgba(74,142,245,0.2);}
.badge-aktif{background:var(--green-bg);color:var(--green);}
.badge-nonaktif{background:var(--red-bg);color:var(--red);}
.log-last{
  text-align:right;flex-shrink:0;
}
.log-last .rel{font-size:12px;font-weight:700;color:var(--ink);}
.log-last .abs{font-size:10px;color:var(--ink-3);margin-top:2px;}
.log-last .never{font-size:12px;font-weight:700;color:var(--ink-3);}
.log-count{font-size:10px;color:var(--ink-3);margin-top:3px;}

.empty-msg{text-align:center;color:var(--ink-3);padding:30px 20px;font-size:12.5px;}
.loading-msg{text-align:center;color:var(--ink-3);padding:30px 20px;font-size:12.5px;}

/* Tab bar */
.tab-bar{
  position:relative;z-index:2;display:flex;gap:8px;margin:18px 20px 0;
  background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:4px;
}
.tab-btn{
  flex:1;text-align:center;padding:9px 0;border-radius:11px;border:none;
  background:transparent;color:var(--ink-3);font-weight:700;font-size:12.5px;
  font-family:inherit;cursor:pointer;
}
.tab-btn.active{background:var(--blue-glow);color:var(--blue);}

/* Filter chip untuk tab aktivitas */
.filter-row{position:relative;z-index:2;display:flex;gap:8px;margin:14px 20px 0;}
.filter-chip{
  padding:6px 13px;border-radius:20px;border:1px solid var(--border);
  background:var(--bg-card);color:var(--ink-3);font-size:11.5px;font-weight:700;
  font-family:inherit;cursor:pointer;
}
.filter-chip.active{background:var(--gold-dim);border-color:rgba(244,197,66,0.3);color:var(--gold);}

/* Kartu aktivitas */
.act-card{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:16px;padding:13px 14px;margin-bottom:9px;
  display:flex;gap:11px;box-shadow:0 4px 16px rgba(0,0,0,0.2);
}
.act-icon{
  width:36px;height:36px;border-radius:11px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:15px;
}
.act-icon.create{background:var(--green-bg);}
.act-icon.update{background:var(--amber-bg);}
.act-icon.delete{background:var(--red-bg);}
.act-icon.reset_password{background:var(--blue-glow);}
.act-body{flex:1;min-width:0;}
.act-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
.act-actor{font-size:13px;font-weight:800;color:var(--ink);}
.act-time{font-size:10px;color:var(--ink-3);white-space:nowrap;flex-shrink:0;}
.act-detail{font-size:12px;color:var(--ink-2);margin-top:3px;line-height:1.4;}
.act-entity-badge{
  display:inline-block;font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;
  background:var(--bg-glass);color:var(--ink-3);margin-top:6px;text-transform:uppercase;letter-spacing:.4px;
}

/* Modal riwayat */
.modal-overlay{position:fixed;inset:0;background:rgba(5,10,25,.7);display:none;align-items:flex-end;justify-content:center;z-index:200;}
.modal-overlay.active{display:flex;}
.modal-box{
  background:var(--bg-card);border:1px solid var(--border);border-radius:20px 20px 0 0;
  padding:20px;max-width:460px;width:100%;max-height:75vh;overflow-y:auto;
}
.modal-title{font-size:15px;font-weight:800;margin-bottom:2px;}
.modal-sub{font-size:11.5px;color:var(--ink-3);margin-bottom:16px;}
.hist-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 12px;background:var(--bg-card2);border:1px solid var(--border);
  border-radius:11px;margin-bottom:8px;font-size:12.5px;
}
.hist-row .rel{font-weight:700;color:var(--ink);}
.hist-row .abs{font-size:10.5px;color:var(--ink-3);margin-top:2px;}
.modal-close{
  width:100%;padding:12px;background:var(--bg-glass);color:var(--ink-2);
  border:1px solid var(--border);border-radius:11px;font-weight:700;
  font-size:13px;cursor:pointer;margin-top:6px;font-family:inherit;
}
</style>
<link rel="stylesheet" href="css/theme-fieldlog.css">
</head>
<body>

<div class="bg-glow"></div>
<div class="container">

  <div class="topbar">
    <a href="pengaturan.html" class="back-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" width="17" height="17"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div class="topbar-title">
      <h1>📋 Log Login</h1>
      <p id="adminInfo">Memuat...</p>
    </div>
    <button class="refresh-btn" onclick="refreshLogs()" title="Muat ulang">🔄</button>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" id="tabBtnLogin" onclick="switchTab('login')">🔐 Log Login</button>
    <button class="tab-btn" id="tabBtnActivity" onclick="switchTab('activity')">📝 Log Aktivitas</button>
  </div>

  <div id="tabLoginPane">
    <div class="summary-row">
      <div class="summary-chip"><div class="num" id="sumTotal">-</div><div class="lbl">Akun</div></div>
      <div class="summary-chip"><div class="num" id="sumToday">-</div><div class="lbl">Login Hari Ini</div></div>
      <div class="summary-chip"><div class="num" id="sumNever">-</div><div class="lbl">Belum Pernah</div></div>
    </div>

    <div class="section-label">Terakhir Login — Terbaru Dulu</div>
    <div class="list-wrap" id="logList">
      <div class="loading-msg">Memuat data log login...</div>
    </div>
  </div>

  <div id="tabActivityPane" style="display:none;">
    <div class="filter-row">
      <button class="filter-chip active" data-filter="" onclick="setActivityFilter('')">Semua</button>
      <button class="filter-chip" data-filter="tegakan" onclick="setActivityFilter('tegakan')">Tegakan</button>
      <button class="filter-chip" data-filter="akun" onclick="setActivityFilter('akun')">Akun</button>
    </div>

    <div class="section-label">Aktivitas Terbaru</div>
    <div class="list-wrap" id="activityList">
      <div class="loading-msg">Memuat log aktivitas...</div>
    </div>
  </div>

</div>

<div class="modal-overlay" id="histModal">
  <div class="modal-box">
    <div class="modal-title" id="histTitle">Riwayat Login</div>
    <div class="modal-sub" id="histSub">50 login terakhir</div>
    <div id="histList"></div>
    <button class="modal-close" onclick="closeHistModal()">Tutup</button>
  </div>
</div>

<script>
let logAccounts = [];
let activityItems = [];
let activityFilter = "";
let activityLoaded = false;
let currentTab = "login";

async function initPage(){
  if(!(await isLoggedIn())){ location.href="index.html"; return; }
  if(!isAdmin()){ alert("Akses ditolak."); location.href="dashboard.html"; return; }
  document.getElementById("adminInfo").textContent = getCurrentUser() + " · Admin";
  await loadLogs();
}

function switchTab(tab){
  currentTab = tab;
  document.getElementById("tabBtnLogin").classList.toggle("active", tab === "login");
  document.getElementById("tabBtnActivity").classList.toggle("active", tab === "activity");
  document.getElementById("tabLoginPane").style.display = tab === "login" ? "block" : "none";
  document.getElementById("tabActivityPane").style.display = tab === "activity" ? "block" : "none";
  if(tab === "activity" && !activityLoaded){
    loadActivity();
  }
}

function setActivityFilter(filter){
  activityFilter = filter;
  document.querySelectorAll(".filter-chip").forEach(el => {
    el.classList.toggle("active", el.dataset.filter === filter);
  });
  loadActivity();
}

async function refreshLogs(){
  if(currentTab === "activity"){
    document.getElementById("activityList").innerHTML = `<div class="loading-msg">Memuat ulang...</div>`;
    await loadActivity();
  } else {
    document.getElementById("logList").innerHTML = `<div class="loading-msg">Memuat ulang...</div>`;
    await loadLogs();
  }
}

async function loadLogs(){
  logAccounts = await getLoginLogSummary();
  renderSummary();
  renderList();
}

async function loadActivity(){
  document.getElementById("activityList").innerHTML = `<div class="loading-msg">Memuat log aktivitas...</div>`;
  activityItems = await getActivityLog(activityFilter || undefined, 150);
  activityLoaded = true;
  renderActivity();
}

const ACT_ICON = { create: "➕", update: "✏️", delete: "🗑️", reset_password: "🔑" };
const ACT_LABEL = { create: "Tambah", update: "Ubah", delete: "Hapus", reset_password: "Reset Password" };
const ENTITY_LABEL = { tegakan: "Tegakan", akun: "Akun" };

function renderActivity(){
  const wrap = document.getElementById("activityList");
  wrap.innerHTML = "";
  if(!activityItems.length){
    wrap.innerHTML = `<div class="empty-msg">Belum ada aktivitas tercatat.</div>`;
    return;
  }
  for(const item of activityItems){
    const card = document.createElement("div");
    card.className = "act-card";
    const iconClass = ACT_ICON[item.action] ? item.action : "update";
    card.innerHTML = `
      <div class="act-icon ${iconClass}">${ACT_ICON[item.action] || "•"}</div>
      <div class="act-body">
        <div class="act-top">
          <div class="act-actor">${item.username || "?"} <span style="color:var(--ink-3);font-weight:600;">— ${ACT_LABEL[item.action] || item.action}</span></div>
          <div class="act-time">${relativeTime(item.createdAt)}</div>
        </div>
        <div class="act-detail">${item.detail || "-"}</div>
        <div class="act-entity-badge">${ENTITY_LABEL[item.entityType] || item.entityType}</div>
      </div>
    `;
    wrap.appendChild(card);
  }
}

function renderSummary(){
  const total = logAccounts.length;
  const now = new Date();
  const todayStr = now.toDateString();
  const today = logAccounts.filter(a => a.last_login && new Date(a.last_login).toDateString() === todayStr).length;
  const never = logAccounts.filter(a => !a.last_login).length;
  document.getElementById("sumTotal").textContent = total;
  document.getElementById("sumToday").textContent = today;
  document.getElementById("sumNever").textContent = never;
}

function renderList(){
  const wrap = document.getElementById("logList");
  wrap.innerHTML = "";
  if(!logAccounts.length){
    wrap.innerHTML = `<div class="empty-msg">Belum ada data akun.</div>`;
    return;
  }

  for(const acc of logAccounts){
    const initials = acc.username.split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase();
    const card = document.createElement("div");
    card.className = "log-card";
    card.onclick = () => openHistModal(acc.username);

    const lastHtml = acc.last_login
      ? `<div class="rel">${relativeTime(acc.last_login)}</div><div class="abs">${absoluteTime(acc.last_login)}</div>`
      : `<div class="never">Belum pernah</div>`;

    card.innerHTML = `
      <div class="log-avatar" id="logav-${cssId(acc.username)}">${initials}</div>
      <div class="log-info">
        <div class="log-name">${acc.username}</div>
        <div class="log-badges">
          <span class="badge badge-role">${(acc.role||"-").toUpperCase()}</span>
          <span class="badge ${acc.status==="Aktif"?"badge-aktif":"badge-nonaktif"}">${acc.status}</span>
        </div>
      </div>
      <div class="log-last">
        ${lastHtml}
        <div class="log-count">${acc.login_count} kali login</div>
      </div>
    `;
    wrap.appendChild(card);
  }

  // Isi foto avatar dari cache (tanpa fetch ulang dari Neon/Drive)
  logAccounts.forEach(async acc => {
    if(typeof cachedGetFotoProfil !== "function") return;
    const foto = await cachedGetFotoProfil(acc.username);
    if(foto){
      const el = document.getElementById("logav-" + cssId(acc.username));
      if(el) el.innerHTML = `<img src="${foto}" alt="${acc.username}">`;
    }
  });
}

async function openHistModal(username){
  document.getElementById("histTitle").textContent = "Riwayat Login — " + username;
  document.getElementById("histSub").textContent = "Memuat...";
  document.getElementById("histList").innerHTML = "";
  document.getElementById("histModal").classList.add("active");

  const history = await getLoginHistory(username, 50);
  document.getElementById("histSub").textContent = history.length
    ? `${history.length} login terakhir`
    : "Belum ada riwayat login.";

  const listEl = document.getElementById("histList");
  listEl.innerHTML = "";
  history.forEach(h => {
    const row = document.createElement("div");
    row.className = "hist-row";
    row.innerHTML = `
      <div><div class="rel">${relativeTime(h.login_at)}</div><div class="abs">${absoluteTime(h.login_at)}</div></div>
    `;
    listEl.appendChild(row);
  });
}

function closeHistModal(){
  document.getElementById("histModal").classList.remove("active");
}

function cssId(name){ return name.replace(/[^a-zA-Z0-9]/g, "_"); }

function absoluteTime(iso){
  const d = new Date(iso);
  return d.toLocaleString("id-ID", { day:"2-digit", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" });
}

function relativeTime(iso){
  const diffMs = Date.now() - new Date(iso).getTime();
  const diffSec = Math.floor(diffMs / 1000);
  if(diffSec < 60) return "Baru saja";
  const diffMin = Math.floor(diffSec / 60);
  if(diffMin < 60) return diffMin + " menit lalu";
  const diffHour = Math.floor(diffMin / 60);
  if(diffHour < 24) return diffHour + " jam lalu";
  const diffDay = Math.floor(diffHour / 24);
  if(diffDay < 30) return diffDay + " hari lalu";
  const diffMonth = Math.floor(diffDay / 30);
  if(diffMonth < 12) return diffMonth + " bulan lalu";
  return Math.floor(diffMonth / 12) + " tahun lalu";
}

initPage();
</script>
</body>
</html>
