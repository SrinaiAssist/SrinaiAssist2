body{

.container{

  min-height:100vh;

  display:flex;
  flex-direction:column;
}

.topbar{
  display:flex;align-items:center;gap:12px;
  padding:20px 20px 14px;
}
.back-btn{
  width:38px;height:38px;border-radius:12px;flex-shrink:0;
  background:var(--bg-glass);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;text-decoration:none;
  transition:background .15s;
}
.back-btn:active{background:rgba(255,255,255,0.1);}
.topbar-title{flex:1;}
.topbar-title h1{font-size:17px;font-weight:800;color:var(--ink);letter-spacing:-0.3px;}
.topbar-title p{font-size:11px;color:var(--ink-3);margin-top:2px;}
.refresh-btn{
  width:38px;height:38px;border-radius:12px;flex-shrink:0;
  background:var(--bg-glass);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:transform .3s;
}
.refresh-btn.spinning svg{animation:spin .8s linear infinite;}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

/* Legenda */
.legend{
  display:flex;gap:14px;flex-wrap:wrap;
  padding:0 20px 12px;
  font-size:10.5px;color:var(--ink-2);
}
.legend-item{display:flex;align-items:center;gap:6px;}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.legend-dot.green{background:var(--green);box-shadow:0 0 6px var(--green);}
.legend-dot.red{background:var(--red);box-shadow:0 0 6px var(--red);}
.legend-tower{width:14px;height:14px;flex-shrink:0;color:var(--gold);}

#map{
  flex:1;
  min-height:420px;
  width:100%;
  background:var(--bg-card2);
}
.leaflet-popup-content-wrapper{
  background:var(--bg-card);color:var(--ink);border-radius:12px;
  border:1px solid var(--border);
}
.leaflet-popup-tip{background:var(--bg-card);}
.leaflet-popup-content{font-family:'Plus Jakarta Sans',Arial,sans-serif;font-size:12.5px;}
.leaflet-popup-content b{color:var(--gold);}

.map-empty-banner{
  margin:12px 20px 0;
  background:var(--bg-glass);border:1px solid var(--border);border-radius:14px;
  padding:12px 14px;font-size:11.5px;color:var(--ink-2);
  display:none;
}
.map-empty-banner.show{display:block;}
.map-updated{
  padding:10px 20px 0;
  font-size:10px;color:var(--ink-3);text-align:center;
}

/* Ikon custom Leaflet */
.tower-icon{
  width:22px;height:22px;
  display:flex;align-items:center;justify-content:center;
  filter:drop-shadow(0 0 3px rgba(0,0,0,0.6));
}
.petugas-dot{
  width:16px;height:16px;border-radius:50%;
  border:2px solid rgba(255,255,255,0.85);
  animation:pulseDot 1.6s ease-in-out infinite;
}
.petugas-dot.green{background:var(--green);box-shadow:0 0 10px 2px var(--green);}
.petugas-dot.red{background:var(--red);box-shadow:0 0 10px 2px var(--red);}
@keyframes pulseDot{
  0%,100%{opacity:1;transform:scale(1);}
  50%{opacity:.7;transform:scale(1.18);}
}

/* Bottom Nav */
.bottomnav{

.nav-item{

.nav-item svg{width:20px;height:20px;}
.nav-item .nav-label{font-size:9.5px;font-weight:700;}
.nav-item.active{color:var(--gold);}

.nav-item.center .nav-circle svg{width:22px;height:22px;}
.nav-item.center .nav-label{color:var(--ink-2);font-size:9.5px;}

<script>
/* =========================================================
   PETA.HTML
   - Tower berkoordinat -> ikon tower kecil (gold), dari
     cachedGetTowerMasterList() (sudah ada, tidak nambah request).
   - Lokasi live petugas -> titik menyala, dari
     GET /api/settings?action=locations (lihat api/settings.js),
     diisi oleh heartbeat otomatis di js/auth.js
     (startLocationHeartbeat(), jalan di SEMUA halaman selama user
     login & izinkan lokasi).
   - Hijau = petugas dalam radius PROXIMITY_METERS dari tower
     manapun yang sudah punya koordinat. Merah = di luar itu.
   - Petugas yang heartbeat terakhirnya lebih tua dari
     STALE_MS dianggap tidak aktif, tidak ditampilkan.
========================================================= */

const PROXIMITY_METERS = 75;      // jarak dianggap "di tower" -- bisa disesuaikan
const STALE_MS = 10 * 60 * 1000;  // 10 menit -- lebih tua dari ini dianggap offline
const POLL_MS = 25 * 1000;        // refresh posisi petugas tiap 25 detik

let map;
let towerPoints = [];             // [{lat,lng,nomor,jalurLabel,status}]
let petugasMarkers = {};          // username -> L.marker

function haversineMeters(lat1, lng1, lat2, lng2){
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function jarakKeTowerTerdekat(lat, lng){
  let min = Infinity;
  for(const t of towerPoints){
    const d = haversineMeters(lat, lng, t.lat, t.lng);
    if(d < min) min = d;
  }
  return min;
}

function towerDivIcon(){
  return L.divIcon({
    className: "",
    html: `<div class="tower-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#F4C542" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L4 9h16l-8-7z"/><path d="M6 9l-2 13M18 9l2 13M5 15h14M6 19h12"/></svg></div>`,
    iconSize: [22, 22],
    iconAnchor: [11, 20],
    popupAnchor: [0, -18],
  });
}

function petugasDivIcon(warna){
  return L.divIcon({
    className: "",
    html: `<div class="petugas-dot ${warna}"></div>`,
    iconSize: [16, 16],
    iconAnchor: [8, 8],
    popupAnchor: [0, -8],
  });
}

function waktuRelatif(iso){
  if(!iso) return "-";
  const detik = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
  if(detik < 60) return detik + " detik lalu";
  const menit = Math.round(detik / 60);
  if(menit < 60) return menit + " menit lalu";
  const jam = Math.round(menit / 60);
  return jam + " jam lalu";
}

async function loadTowerMarkers(){
  const allTower = await cachedGetTowerMasterList();
  const allJalur = await cachedGetJalurMasterList();
  const labelOf = (jalurId) => {
    const j = (allJalur || []).find(j => j.id === jalurId);
    return j ? j.label : jalurId;
  };

  towerPoints = [];
  const withCoord = (allTower || []).filter(t => typeof t.latitude === "number" && typeof t.longitude === "number");

  for(const t of withCoord){
    towerPoints.push({ lat: t.latitude, lng: t.longitude, nomor: t.nomor, jalurLabel: labelOf(t.jalurId), status: t.status });
    L.marker([t.latitude, t.longitude], { icon: towerDivIcon() })
      .addTo(map)
      .bindPopup(`<b>Tower ${t.nomor}</b><br>Jalur ${labelOf(t.jalurId)}<br>Status: ${t.status || "belum diisi"}`);
  }

  const banner = document.getElementById("emptyBanner");
  if(withCoord.length === 0){
    banner.textContent = "Belum ada tower yang punya koordinat -- isi lewat halaman Tower dulu (tombol Edit Data Tower) supaya muncul di peta.";
    banner.classList.add("show");
  } else {
    banner.classList.remove("show");
  }

  // Posisikan/zoom peta ke area tower kalau ada, kalau belum ada
  // koordinat sama sekali fallback ke titik default (Cianjur, Jawa Barat)
  // supaya peta tidak kosong-melompong.
  if(withCoord.length > 0){
    const bounds = L.latLngBounds(withCoord.map(t => [t.latitude, t.longitude]));
    map.fitBounds(bounds, { padding: [30, 30], maxZoom: 15 });
  } else {
    map.setView([-6.822, 107.142], 12); // fallback: sekitar Cianjur
  }
}

async function loadPetugasLocations(){
  const [locResult, accounts] = await Promise.all([
    apiRequest("/api/settings?action=locations"),
    cachedGetAllAccountsFull().catch(() => []),
  ]);
  if(!locResult || !locResult.success) return;

  const locations = locResult.locations || {};
  const accountMap = {};
  (accounts || []).forEach(a => { accountMap[a.username] = a; });

  const usernameMasihAktif = new Set();

  for(const username of Object.keys(locations)){
    const loc = locations[username];
    if(!loc || typeof loc.lat !== "number" || typeof loc.lng !== "number") continue;

    const umurMs = loc.updatedAt ? (Date.now() - new Date(loc.updatedAt).getTime()) : Infinity;
    if(umurMs > STALE_MS) continue; // dianggap offline, jangan tampilkan

    usernameMasihAktif.add(username);

    const jarak = jarakKeTowerTerdekat(loc.lat, loc.lng);
    const warna = jarak <= PROXIMITY_METERS ? "green" : "red";
    const acc = accountMap[username];
    const peran = acc ? `${acc.role || "-"}${acc.jabatan ? " · " + acc.jabatan : ""}` : "-";
    const popupHtml = `<b>${username}</b><br>${peran}<br>${warna === "green" ? "Di lokasi tower" : "Di luar tower"}<br><span style="color:var(--ink-3)">Update ${waktuRelatif(loc.updatedAt)}</span>`;

    if(petugasMarkers[username]){
      petugasMarkers[username].setLatLng([loc.lat, loc.lng]);
      petugasMarkers[username].setIcon(petugasDivIcon(warna));
      petugasMarkers[username].setPopupContent(popupHtml);
    } else {
      petugasMarkers[username] = L.marker([loc.lat, loc.lng], { icon: petugasDivIcon(warna) })
        .addTo(map)
        .bindPopup(popupHtml);
    }
  }

  // Hapus marker petugas yang sudah tidak aktif/stale
  for(const username of Object.keys(petugasMarkers)){
    if(!usernameMasihAktif.has(username)){
      map.removeLayer(petugasMarkers[username]);
      delete petugasMarkers[username];
    }
  }

  document.getElementById("mapUpdated").textContent =
    `${usernameMasihAktif.size} petugas aktif -- diperbarui ${new Date().toLocaleTimeString("id-ID")}`;
}

async function manualRefresh(){
  const btn = document.getElementById("refreshBtn");
  btn.classList.add("spinning");
  try {
    await loadPetugasLocations();
  } finally {
    setTimeout(() => btn.classList.remove("spinning"), 400);
  }
}

async function initPage(){
  if(!(await isLoggedIn())){ location.href = "index.html"; return; }

  map = L.map("map", { zoomControl: true, attributionControl: false });
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
  }).addTo(map);

  await loadTowerMarkers();
  await loadPetugasLocations();
  setInterval(loadPetugasLocations, POLL_MS);
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", initPage);
} else {
  initPage();
}
</script>
