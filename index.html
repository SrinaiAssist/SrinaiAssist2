<!DOCTYPE html>
<html lang="id">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0B1220">
<link rel="icon" href="/assets/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
<title>SRINAI ASSIST AI</title>
<script src="js/auth.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --void-navy:#0B1220;
    --deep-circuit:#101E33;
    --deep-circuit-2:#152541;
    --voltage-amber:#FFB238;
    --spark-cyan:#54E8D6;
    --steel-mist:#8CA0B3;
    --alert-copper:#FF6B4A;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(ellipse 90% 55% at 50% 0%, #16294a 0%, var(--void-navy) 62%),
      var(--void-navy);
    background-size:cover; background-position:center; background-repeat:no-repeat;
    color:#EAF1F8;
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    overflow-x:hidden;
    position:relative;
  }

  /* When admin sets a custom login background image */
  body.has-custom-bg::before{
    content:""; position:fixed; inset:0; background:rgba(11,18,32,0.62); z-index:0;
  }
  body.has-custom-bg .line-wrap, body.has-custom-bg .grid-dots{ display:none; }

  .grid-dots{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image: radial-gradient(circle, rgba(140,160,179,0.10) 1px, transparent 1px);
    background-size: 26px 26px;
    mask-image: linear-gradient(to bottom, transparent 0%, black 30%, black 70%, transparent 100%);
  }

  #loginPage{
    position:relative; z-index:1; width:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:space-between;
    min-height:100vh;
  }

  .stage{ position:relative; width:100%; max-width:520px; padding:38px 24px 0; }

  /* ===== Transmission line signature ===== */
  .line-wrap{ width:100%; height:190px; position:relative; }
  svg.grid-svg{ width:100%; height:100%; overflow:visible; }

  .tower{
    stroke:#3A5170; stroke-width:2; fill:none;
    opacity:0;
    animation: towerRise 900ms cubic-bezier(.2,.8,.2,1) forwards;
  }
  .tower.t2{ animation-delay:180ms; }

  .cable{
    fill:none; stroke:url(#cableGrad); stroke-width:2;
    stroke-dasharray:520; stroke-dashoffset:520;
    animation: drawCable 1300ms 420ms cubic-bezier(.3,.7,.2,1) forwards;
  }

  .spark{
    offset-path: path('M 30 96 Q 210 168 390 96');
    offset-rotate:0deg;
    animation: travel 3.2s 1.9s ease-in-out infinite;
    opacity:0;
  }
  .spark-core{
    width:9px;height:9px;border-radius:50%;
    background:var(--spark-cyan);
    box-shadow:0 0 8px 2px var(--spark-cyan), 0 0 22px 6px rgba(84,232,214,0.45);
  }

  @keyframes towerRise{
    from{ opacity:0; transform:translateY(14px) scaleY(0.85); transform-origin:bottom; }
    to{ opacity:1; transform:translateY(0) scaleY(1); }
  }
  @keyframes drawCable{ to{ stroke-dashoffset:0; } }
  @keyframes travel{
    0%{ offset-distance:0%; opacity:0; }
    8%{ opacity:1; }
    92%{ opacity:1; }
    100%{ offset-distance:100%; opacity:0; }
  }

  .glow-bulb{ animation: bulbPulse 3.2s 2.1s ease-in-out infinite; }
  @keyframes bulbPulse{ 0%,100%{ opacity:.35; } 50%{ opacity:1; } }

  /* ===== Brand block ===== */
  .brand{
    text-align:center; margin-top:2px; opacity:0;
    animation: fadeUp 700ms 1.1s cubic-bezier(.2,.8,.2,1) forwards;
  }
  .login-logo{
    max-width:88px; max-height:88px; margin:0 auto 12px; display:none;
    border-radius:16px;
  }
  .brand-mark{
    font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:3px;
    color:var(--spark-cyan); text-transform:uppercase;
  }
  .brand-title{
    font-family:'Space Grotesk',sans-serif; font-size:34px; font-weight:700; letter-spacing:0.5px;
    margin-top:6px;
    background:linear-gradient(180deg,#F4F8FB 0%, #C9D6E4 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .version{ color:var(--steel-mist); font-size:12px; margin-top:6px; font-family:'JetBrains Mono',monospace; letter-spacing:0.5px; }
  .brand-quote{
    color:var(--steel-mist); font-size:13.5px; font-style:italic;
    margin:14px auto 0; max-width:340px; line-height:1.6;
  }

  @keyframes fadeUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

  /* ===== Login card ===== */
  .login-container{ width:100%; }
  .login-box{
    margin:30px auto 0; width:100%;
    background: linear-gradient(180deg, rgba(21,37,65,0.72), rgba(16,30,51,0.72));
    border:1px solid rgba(140,160,179,0.16);
    border-radius:18px;
    padding:26px 22px 24px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.55);
    opacity:0; transform: translateY(18px);
    animation: cardIn 750ms 1.4s cubic-bezier(.2,.8,.2,1) forwards;
    position:relative;
  }
  @keyframes cardIn{ to{ opacity:1; transform:translateY(0);} }

  .field{ position:relative; margin-bottom:14px; }
  .field label{
    display:block; font-size:11px; letter-spacing:1.5px; text-transform:uppercase;
    color:var(--steel-mist); margin-bottom:7px; font-family:'JetBrains Mono',monospace;
  }
  .login-box select, .login-box input{
    width:100%; padding:14px 15px; border-radius:11px;
    border:1px solid rgba(140,160,179,0.25);
    background:rgba(11,18,32,0.55);
    color:#EAF1F8; font-size:15px; font-family:'Inter',sans-serif;
    outline:none; transition:border-color 180ms, box-shadow 180ms, background 180ms;
    appearance:none; margin-bottom:0;
  }
  .login-box select{ cursor:pointer; }
  .login-box select:focus, .login-box input:focus{
    border-color: var(--spark-cyan);
    box-shadow:0 0 0 3px rgba(84,232,214,0.14);
    background:rgba(11,18,32,0.85);
  }
  .field-icon{ position:absolute; right:14px; top:41px; color:var(--steel-mist); pointer-events:none; font-size:13px; }

  .login-box button{
    width:100%; padding:15px; border:none; border-radius:11px; cursor:pointer;
    margin-top:6px;
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15.5px; letter-spacing:0.3px;
    color:#161009;
    background: linear-gradient(135deg, var(--voltage-amber), #FFCF73);
    position:relative; overflow:hidden;
    box-shadow: 0 10px 24px -8px rgba(255,178,56,0.45);
    transition: transform 150ms ease, box-shadow 150ms ease;
  }
  .login-box button:active{ transform:scale(0.98); }

  .ripple{
    position:absolute; border-radius:50%; background:rgba(255,255,255,0.55);
    transform:scale(0); pointer-events:none;
    animation: rippleAnim 650ms ease-out forwards;
  }
  @keyframes rippleAnim{ to{ transform:scale(2.6); opacity:0; } }

  .status-footer{
    width:100%; max-width:520px; padding:18px 24px 26px;
    display:flex; align-items:center; justify-content:center; gap:9px;
    color:var(--steel-mist); font-family:'JetBrains Mono',monospace; font-size:11.5px;
    letter-spacing:0.5px; z-index:1;
    opacity:0; animation: fadeUp 700ms 1.9s forwards;
  }
  .dot-live{
    width:7px;height:7px;border-radius:50%; background:var(--spark-cyan);
    box-shadow:0 0 6px 2px rgba(84,232,214,0.6);
    animation: bulbPulse 2s ease-in-out infinite;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; }
  }

  /* ---------- theme switcher ---------- */
  .theme-switch{
    display:flex; gap:8px; width:100%; max-width:520px; padding:18px 24px 0; z-index:2; position:relative;
  }
  .theme-pill{
    flex:1; text-align:center; padding:9px 6px; border-radius:20px; cursor:pointer;
    font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.6px; text-transform:uppercase;
    border:1px solid rgba(140,160,179,0.3); color:var(--steel-mist); transition:all 150ms ease;
  }
  .theme-pill.active{ background:var(--voltage-amber); color:#161009; border-color:var(--voltage-amber); font-weight:700; }
</style>
</head>
<body>

<div id="loginPage">

  <div class="grid-dots"></div>

  <div class="stage">

    <div class="line-wrap">
      <svg class="grid-svg" viewBox="0 0 420 190" preserveAspectRatio="xMidYMid meet">
        <defs>
          <linearGradient id="cableGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#3A5170"/>
            <stop offset="50%" stop-color="#5A7896"/>
            <stop offset="100%" stop-color="#3A5170"/>
          </linearGradient>
        </defs>
        <g class="tower t1">
          <path d="M30 170 L18 96 L30 96 L30 60 L42 96 L30 96 L30 170 M12 130 L48 130 M16 108 L44 108"/>
          <circle class="glow-bulb" cx="30" cy="58" r="3" fill="#FFB238"/>
        </g>
        <g class="tower t2">
          <path d="M390 170 L378 96 L390 96 L390 60 L402 96 L390 96 L390 170 M372 130 L408 130 M376 108 L404 108"/>
          <circle class="glow-bulb" cx="390" cy="58" r="3" fill="#FFB238"/>
        </g>
        <path class="cable" d="M 30 96 Q 210 168 390 96" />
        <line x1="0" y1="170" x2="420" y2="170" stroke="rgba(140,160,179,0.12)" stroke-width="1"/>
      </svg>
      <div class="spark"><div class="spark-core"></div></div>
    </div>

    <div class="login-container">
      <div class="brand">
        <img id="loginLogoImg" class="login-logo" style="display:none;">
        <div class="brand-mark">JARINGAN &nbsp;·&nbsp; TEGANGAN TINGGI</div>
        <div class="brand-title">SRINAI ASSIST AI</div>
        <div class="version">Version 1.0.0</div>
        <p class="brand-quote">&ldquo;Setiap tower yang diperiksa hari ini adalah keandalan sistem yang terjaga esok hari.&rdquo;</p>
      </div>

      <div class="login-box">
        <div class="field">
          <label for="user">Akun Petugas</label>
          <select id="user">
            <option value="">Pilih Akun</option>
          </select>
        </div>
        <div class="field">
          <label for="password">Kata Sandi</label>
          <input type="password" id="password" placeholder="••••••••" onkeydown="if(event.key==='Enter') login()">
          <span class="field-icon">🔒</span>
        </div>
        <button onclick="login()" id="btnMasuk"><span class="bolt">⚡</span> MASUK</button>
      </div>
    </div>

  </div>

  <div class="status-footer">
    <span class="dot-live"></span> STATUS GRID: ONLINE &nbsp;·&nbsp; v1.0.0
  </div>

</div>

<script>
(async function init() {
  // Redirect jika sudah login
  if (typeof isLoggedIn === "function" && await isLoggedIn()) {
    location.href = "dashboard.html";
    return;
  }

  // Terapkan logo & background custom (jika sudah diatur Admin lewat Pengaturan)
  const settings = await getAppSettings(["loginLogo", "loginBackground"]);

  if (settings.loginLogo) {
    const logoImg = document.getElementById("loginLogoImg");
    logoImg.src = settings.loginLogo;
    logoImg.style.display = "block";
  }

  if (settings.loginBackground) {
    document.body.style.backgroundImage = "url('" + settings.loginBackground + "')";
    document.body.classList.add("has-custom-bg");
  }

  // Load akun aktif dari server (otomatis termasuk akun baru dari Kelola Akun)
  const userSelect = document.getElementById("user");
  const activeUsernames = await getActiveUsernames();
  activeUsernames.forEach(username => {
    const option = document.createElement("option");
    option.value = username;
    option.textContent = username;
    userSelect.appendChild(option);
  });
})();

async function login() {
  const username = document.getElementById("user").value;
  const password = document.getElementById("password").value;
  if (!username) { alert("Pilih akun!"); return; }
  if (!password) { alert("Masukkan password!"); return; }

  const btn = document.getElementById("btnMasuk");
  const originalHTML = btn.innerHTML;
  btn.style.opacity = "0.75";
  btn.innerHTML = "⏳ MEMERIKSA…";

  const result = await loginUser(username, password);
  if (result.success) {
    location.href = "dashboard.html";
    return;
  }
  btn.style.opacity = "1";
  btn.innerHTML = originalHTML;
  alert(result.message || "Login gagal.");
}
</script>

</body>
</html>
