*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{font-family:'Plus Jakarta Sans',Arial,sans-serif;background:var(--bg);color:var(--ink);}

/* ===== Header ===== */
.header{

  padding:20px 18px;

.back-circle{
  width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.12);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;text-decoration:none;
}
.ai-avatar{
  width:42px;height:42px;border-radius:13px;
  background:linear-gradient(135deg, var(--gold), var(--navy));
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.header-text{flex:1;min-width:0;}
.header-text h1{color:white;font-size:16px;font-weight:800;letter-spacing:-0.2px;}
.header-text p{color:rgba(255,255,255,.6);font-size:11px;margin-top:1px;display:flex;align-items:center;gap:5px;}
.status-dot{width:7px;height:7px;border-radius:50%;background:#4ADE80;display:inline-block;}

/* ===== Tabs ===== */
.tabs{display:flex;gap:8px;padding:14px 18px 0;flex-shrink:0;}
.tab-btn{
  flex:1;padding:10px;border:none;border-radius:12px;
  background:var(--surface);color:var(--muted);font-weight:700;font-size:12.5px;
  cursor:pointer;box-shadow:0 2px 8px rgba(7,29,66,0.05);
}
.tab-btn.active{background:var(--navy);color:white;}
.hidden{display:none;}

/* ===== Chat area ===== */
.chat-wrap{flex:1;display:flex;flex-direction:column;padding:14px 18px 0;min-height:0;}
.chat-area{
  flex:1;overflow-y:auto;
  display:flex;flex-direction:column;gap:10px;
  padding-bottom:10px;
}

.bubble-row{display:flex;}
.bubble-row.mine{justify-content:flex-end;}
.bubble-row.theirs{justify-content:flex-start;}

.bubble{
  max-width:78%;
  padding:11px 14px;
  border-radius:16px;
  font-size:13.5px;
  line-height:1.5;
  white-space:pre-wrap;

}
.bubble.mine{

}
.bubble.ai{

  border-radius:16px 16px 16px 4px;
  border-left:3px solid var(--teal);

.bubble.admin{

  border-radius:16px 16px 16px 4px;

}
.bubble-sender{font-size:10.5px;font-weight:700;margin-bottom:4px;opacity:.65;}

.typing-dots{display:inline-flex;gap:4px;padding:4px 0;}
.typing-dots span{

.typing-dots span:nth-child(2){animation-delay:.15s;}
.typing-dots span:nth-child(3){animation-delay:.3s;}

<script>
if(!isLoggedIn()){
  location.href="index.html";
}

/* =========================================================
   KONFIGURASI BACKEND AI (Gemini via proxy/backend sendiri)
========================================================= */
const AI_BACKEND_URL = "/api/gemini";
const AI_TIMEOUT_MS = 20000;
const AI_HISTORY_LIMIT = 10;

const currentUser = getCurrentUser();
const role = getCurrentRole();

const params = new URLSearchParams(window.location.search);
const adminView = params.get("adminView");

let chatOwner = currentUser;
if(isAdmin() && adminView){
  chatOwner = adminView;
}

const chatKey = "aiChat_" + chatOwner;

let chatData = JSON.parse(localStorage.getItem(chatKey)) || [];
let requests = JSON.parse(localStorage.getItem("aiRequests")) || [];

if(isAdmin() && adminView){
  document.getElementById("headerInfo").innerHTML = "Bantuan Admin";
} else {
  document.getElementById("headerInfo").innerHTML = "SrinAI";
}

function showTab(tab){
  document.getElementById("chatTab").classList.add("hidden");
  document.getElementById("sosTab").classList.add("hidden");
  document.getElementById("btnChat").classList.remove("active");
  document.getElementById("btnSos").classList.remove("active");
  if(tab==="chat"){
    document.getElementById("chatTab").classList.remove("hidden");
    document.getElementById("btnChat").classList.add("active");
  } else {
    document.getElementById("sosTab").classList.remove("hidden");
    document.getElementById("btnSos").classList.add("active");
  }
}

function saveChat(){
  localStorage.setItem(chatKey, JSON.stringify(chatData));
}

function deleteMyChat(){
  if(isAdmin() && adminView){
    alert("Admin tidak dapat menghapus chat pengguna.");
    return;
  }
  if(!confirm("Hapus seluruh chat AI Anda?")) return;
  localStorage.removeItem(chatKey);
  chatData=[];
  loadChat();
  alert("Chat berhasil dihapus.");
}

function aiResponse(text){
  chatData.push({ user:"SrinAI 🤖", text:text });
  playChatReplyChime();
}

// Nada "jawaban benar" tiap SrinAI membalas di sini. Sama persis dengan
// chat.html: kalau autoplay bersuara diblokir browser, otomatis diputar
// begitu user tap layar.
function playChatReplyChime(){
  const chime = new Audio("assets/audio/chat-reply.wav");
  chime.volume = 0.6;
  const p = chime.play();
  if(p !== undefined){
    p.catch(() => {
      const resumeOnce = () => chime.play().catch(() => {});
      document.addEventListener("click", resumeOnce, { once:true });
      document.addEventListener("touchstart", resumeOnce, { once:true });
    });
  }
}

function buildHistory(){
  return chatData
    .filter(item => item.user==="SrinAI 🤖" || item.user===currentUser)
    .slice(-AI_HISTORY_LIMIT)
    .map(item => ({
      role: item.user==="SrinAI 🤖" ? "model" : "user",
      text: item.text
    }));
}

function showTypingIndicator(){
  const area = document.getElementById("chatArea");
  const row = document.createElement("div");
  row.className = "bubble-row theirs";
  row.id = "typingIndicator";
  row.innerHTML = `<div class="bubble ai"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
  area.appendChild(row);
  area.scrollTop = area.scrollHeight;
}

function removeTypingIndicator(){
  const el = document.getElementById("typingIndicator");
  if(el) el.remove();
}

/* =========================================================
   FETCH KONTEKS DATA APLIKASI (span & tegakan dari API)
   Dipanggil setiap kali user mengirim pesan ke SrinAI,
   supaya AI selalu punya data terkini dari server.
========================================================= */
async function fetchAppContext() {
  try {
    const profile = JSON.parse(localStorage.getItem("currentUser") || "{}");
    const jalurId = profile.jalur_id || null;

    // Fetch span (filter by jalur user jika ada)
    const spanUrl = jalurId
      ? `/api/span?jalurId=${encodeURIComponent(jalurId)}`
      : `/api/span`;
    const [spanRes, tegakanRes, botCommandsResult] = await Promise.all([
      fetch(spanUrl),
      fetch(`/api/tegakan?includeTtd=false`),
      // Katalog command CommandBot (sama data yang tampil di halaman "Ruang
      // Kerja SrinAI" / workspace-command.html) -- supaya SrinAI bisa jawab
      // pertanyaan soal command bot dari data asli, dan tahu trigger_text
      // apa saja yang valid untuk ACTION run_bot_command. Gagal ambil ini
      // TIDAK BOLEH bikin seluruh context gagal -- cukup botCommands kosong.
      apiRequest("/api/settings?action=botCommands", { method: "GET" }).catch((e) => {
        console.warn("Gagal ambil katalog command bot:", e);
        return null;
      }),
    ]);

    const spanData  = spanRes.ok  ? await spanRes.json()  : { span: [] };
    const tegakanData = tegakanRes.ok ? await tegakanRes.json() : { tegakan: [] };

    // Cuma kirim field yang AI butuh (trigger, deskripsi, status) -- buang
    // timestamp/group_scope dll supaya context tetap ringkas. SENGAJA gak
    // kirim field "name" (mis. "tambah-tegakan", label manusia buat
    // tampilan di Ruang Kerja) -- ternyata field ini nyaris kembar sama
    // triggerText ("tambahtegakan") cuma beda strip, dan AI kepancing pakai
    // "name" itu buat trigger command padahal yang valid cuma triggerText.
    // Daripada berharap AI selalu milih field yang bener, lebih aman buang
    // field yang bisa bikin ketuker dari sumbernya.
    const botCommands = (botCommandsResult && botCommandsResult.success && Array.isArray(botCommandsResult.commands))
      ? botCommandsResult.commands.map(c => ({
          triggerText: c.trigger_text,
          description: c.description || "",
          status: c.status,
        }))
      : [];

    // PENTING: ttdData berisi foto tanda tangan dalam base64 (bisa ratusan
    // KB per tegakan). AI tidak butuh lihat gambar TTD untuk jawab
    // pertanyaan -- kalau ikut dikirim, sekali chat bisa langsung
    // menghabiskan ratusan ribu token Gemini (ini penyebab utama error
    // 429 "quota exceeded" yang sering muncul). Buang field ttdData
    // sebelum digabung ke context, sisakan cuma metadata yang relevan.
    const tegakanRingkas = (tegakanData.tegakan || []).map(t => ({
      id: t.id,
      spanId: t.spanId,
      nama: t.nama,
      idTegakan: t.idTegakan,
      pemilikNama: t.pemilikNama,
      pemilikAlamat: t.pemilikAlamat,
      pemilikTelp: t.pemilikTelp,
      petugas: t.petugas,
      adaTtd: !!t.ttdData,
      tanggal: t.tanggal,
    }));

    // Gabungkan tegakan ke span masing-masing agar mudah dibaca AI
    const tegakanBySpan = {};
    tegakanRingkas.forEach(t => {
      if (!tegakanBySpan[t.spanId]) tegakanBySpan[t.spanId] = [];
      tegakanBySpan[t.spanId].push(t);
    });

    const enrichedSpan = (spanData.span || []).map(s => ({
      ...s,
      tegakan: tegakanBySpan[s.id] || []
    }));

    return {
      profile,
      spans: enrichedSpan,
      totalSpan: enrichedSpan.length,
      totalTegakan: tegakanRingkas.length,
      baData: JSON.parse(localStorage.getItem("baData") || "[]"),
      jadwal: JSON.parse(localStorage.getItem("jadwalData") || "[]"),
      botCommands,
    };
  } catch (e) {
    console.warn("fetchAppContext gagal:", e);
    return null;
  }
}

async function callGeminiBackend(message){
  const controller = new AbortController();
  const timeoutId = setTimeout(()=>controller.abort(), AI_TIMEOUT_MS);

  try{
    // Ambil data span & tegakan dari server sebelum kirim ke AI
    const appContext = await fetchAppContext();

    const res = await fetch(AI_BACKEND_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message: message,
        history: buildHistory(),
        context: appContext ? JSON.stringify(appContext, null, 2) : undefined
      }),
      signal: controller.signal
    });

    clearTimeout(timeoutId);

    if(!res.ok){
      throw new Error("Server merespons dengan status " + res.status);
    }

    const data = await res.json();
    if(!data || typeof data.reply !== "string" || !data.reply.trim()){
      throw new Error("Format balasan dari server tidak sesuai.");
    }
    return { reply: data.reply, action: data.action || null, appContext: appContext };

  } catch(err){
    clearTimeout(timeoutId);
    if(err.name === "AbortError"){
      throw new Error("Waktu tunggu balasan AI habis. Coba lagi.");
    }
    throw err;
  }
}

/* =========================================================
   PENCARIAN BA NYATA DI SOS (baData)
========================================================= */
function extractSpanNumber(text){
  const m = text.match(/span\D{0,5}(\d{1,3})/i) || text.match(/(\d{1,3})/);
  if(!m) return null;
  return m[1].padStart(3,"0");
}

function findBABySpan(spanNumber){
  const baData = JSON.parse(localStorage.getItem("baData")) || [];
  return baData.filter(item => item.span === spanNumber);
}

function handleCariBA(text){
  const spanNumber = extractSpanNumber(text);
  if(!spanNumber){
    aiResponse("Span yang mana ya? Tulis nomornya, contoh: \"mana BA span 050?\"");
    saveChat();
    loadChat();
    return true;
  }

  const hasil = findBABySpan(spanNumber);

  if(hasil.length === 0){
    aiResponse(`Belum ada BA tersimpan untuk Span ${spanNumber} di SOS. Mau saya bantu buatkan? Lengkapi dulu data tegakannya di Catatan Span ya.`);
    chatData.push({ user:"SYSTEM", text:"NO_BA_LINK_"+spanNumber });
    saveChat();
    loadChat();
    return true;
  }

  const plural = hasil.length > 1 ? `Ada ${hasil.length} BA nih buat Span ${spanNumber}.` : `Ketemu, BA Span ${spanNumber} ada.`;
  aiResponse(plural);
  chatData.push({ user:"SYSTEM", text:"BA_RESULTS_" + JSON.stringify(hasil.map(h=>({id:h.id, judul:h.judul, pemilik:h.pemilik, tanggal:h.tanggal, sumber:h.sumber}))) });
  saveChat();
  loadChat();
  return true;
}

function isAskingForBA(text){
  const t = text.toLowerCase();
  const baKeywords = ["ba ", " ba", "berita acara", "ba span", "ba ditemukan"];
  const mentionsBA = baKeywords.some(k=>t.includes(k)) || /\bba\b/.test(t);
  return mentionsBA && t.match(/\d/);
}

/* =========================================================
   Deteksi permintaan MEMBUATKAN BA baru (bukan sekadar cari BA
   yang sudah ada). Kalau ini kena, jangan potong ke handleCariBA
   — biarkan lanjut ke AI supaya AI keluarkan ACTION BLOCK.
========================================================= */
function isRequestingBAGeneration(text){
  const t = text.toLowerCase();
  const mentionsBA = /\bba\b/.test(t) || t.includes("berita acara");
  const buatKeywords = ["buatkan", "buat ba", "bikinkan", "bikinin", "bikin ba", "generate ba", "generatekan", "buatin"];
  return mentionsBA && buatKeywords.some(k=>t.includes(k));
}

/* =========================================================
   EKSEKUSI ACTION generate_ba DARI SrinAI
   Data span+tegakan diambil dari appContext yang sudah di-fetch
   bareng saat kirim pesan ke backend (tidak perlu fetch ulang).
========================================================= */
function findSpanByNomor(appContext, spanNomor){
  if(!appContext || !Array.isArray(appContext.spans) || !spanNomor) return null;
  const target = String(spanNomor).trim().replace(/^0+/, "");
  return appContext.spans.find(s => String(s.nomor).trim().replace(/^0+/, "") === target) || null;
}

function pickTegakanForBA(span, jenisPohon, maxTotal){
  const jenisLower = Array.isArray(jenisPohon) ? jenisPohon.filter(Boolean).map(j=>String(j).toLowerCase()) : [];
  const all = span.tegakan || [];
  const pool = all.filter(t => t.adaTtd && t.pemilikNama && t.pemilikAlamat);

  const candidates = jenisLower.length
    ? pool.filter(t => jenisLower.some(j => (t.nama||"").toLowerCase().includes(j)))
    : pool;

  const result = [];
  // Utamakan minimal 1 wakil per jenis yang diminta, biar semua jenis kebagian
  jenisLower.forEach(j=>{
    const found = candidates.find(t => (t.nama||"").toLowerCase().includes(j) && !result.includes(t));
    if(found) result.push(found);
  });
  // Sisanya isi dari kandidat lain sampai batas maxTotal
  candidates.forEach(t=>{
    if(!result.includes(t)) result.push(t);
  });

  const limit = (typeof maxTotal === "number" && maxTotal > 0) ? maxTotal : result.length;
  const picked = result.slice(0, limit);

  // Diagnostik kenapa hasilnya kosong (kalau kosong), supaya pesan ke user akurat:
  // - totalTegakan: 0        -> span ini memang belum ada data tegakan sama sekali
  // - pool kosong             -> ada tegakan, tapi belum ada yang datanya lengkap
  // - candidates kosong       -> ada tegakan lengkap, tapi tidak ada yang cocok jenisPohon yang diminta
  let reason = null;
  if(picked.length === 0){
    if(all.length === 0){
      reason = "no_tegakan";
    } else if(pool.length === 0){
      reason = "incomplete_data";
    } else if(jenisLower.length && candidates.length === 0){
      reason = "jenis_not_found";
    } else {
      reason = "incomplete_data";
    }
  }

  const namaTersedia = [...new Set(pool.map(t=>t.nama).filter(Boolean))];
  return { picked, reason, namaTersedia };
}

function handleGenerateBaAction(action, appContext){
  if(!action || action.type !== "generate_ba") return;

  const span = findSpanByNomor(appContext, action.span);
  if(!span){
    chatData.push({ user:"SrinAI 🤖", text: action.span
      ? `Span ${action.span} gak ketemu di data jalur kamu bos, cek lagi nomornya.`
      : `Span-nya mau yang mana bos? Sebutin nomornya ya.` });
    saveChat(); loadChat();
    return;
  }

  const { picked, reason, namaTersedia } = pickTegakanForBA(span, action.jenisPohon, action.maxTotal);
  if(picked.length === 0){
    const jenisTxt = Array.isArray(action.jenisPohon) && action.jenisPohon.length ? action.jenisPohon.join(", ") : "";
    let msg;
    if(reason === "no_tegakan"){
      msg = `Span ${span.nomor} belum ada data tegakan sama sekali bos. Catat dulu tegakannya di Catatan Span.`;
    } else if(reason === "jenis_not_found"){
      msg = namaTersedia.length
        ? `Gak nemu tegakan jenis "${jenisTxt}" di span ${span.nomor} bos. Yang ada di situ: ${namaTersedia.join(", ")}. Mungkin maksudnya bukan jenis pohon?`
        : `Gak nemu tegakan jenis "${jenisTxt}" di span ${span.nomor} bos, dan tegakan yang datanya lengkap juga belum ada. Cek lagi ya.`;
    } else {
      msg = `Data tegakan span ${span.nomor}${jenisTxt ? ` (${jenisTxt})` : ""} belum lengkap (nama pemilik/alamat/TTD) bos. Lengkapi dulu di Catatan Span, baru gas bikin BA-nya.`;
    }
    chatData.push({ user:"SrinAI 🤖", text: msg });
    saveChat(); loadChat();
    return;
  }

  const mode = action.mode === "template" ? "template" : "background";
  chatData.push({
    user:"SYSTEM",
    text: "GENERATE_BA_LINK_" + JSON.stringify({
      spanId: span.id,
      ids: picked.map(t=>t.id).join(","),
      mode: mode,
      label: `Span ${span.nomor} — ${picked.length} tegakan (${picked.map(t=>t.nama).join(", ")})`
    })
  });
  saveChat(); loadChat();
}

/* =========================================================
   INTEGRASI COMMANDBOT — jalankan command bot beneran dari chat
   SrinAI (ACTION run_bot_command dari backend, lihat api/gemini.js).

   chatId dibuat PERSIS sama dengan konvensi command-bot.html &
   workspace-command.html ("web:<username>") supaya berbagi satu
   sesi "web" yang konsisten per user lintas ketiga halaman itu.

   sessionActive disimpan di localStorage (bukan cuma variabel JS)
   supaya kalau halaman di-reload di tengah command multi-langkah
   (mis. /tambahtegakan yang masih nunggu beberapa isian), SrinAI
   tetap ingat harus meneruskan pesan berikutnya langsung ke
   CommandBot, bukan balik nanya ke AI dari awal.
========================================================= */
const botCommandSessionKey = "aiCommandSession_" + chatOwner;
let botCommandSessionActive = localStorage.getItem(botCommandSessionKey) === "1";

function setBotCommandSessionActive(active){
  botCommandSessionActive = !!active;
  if(botCommandSessionActive){
    localStorage.setItem(botCommandSessionKey, "1");
  } else {
    localStorage.removeItem(botCommandSessionKey);
  }
}

// AI kadang nulis trigger command dikit meleset dari triggerText asli
// (nambah/ilangin strip, beda kapital, dll -- mis. "/tambah-tegakan" padahal
// yang terdaftar "/tambahtegakan"). Botlab match trigger-nya EXACT, jadi
// selisih sedikit aja bikin balesannya "Perintah tidak dikenali" walau
// command-nya sebenernya ada & live. Ini pengaman: cocokkan kata pertama
// dari "text" ke daftar triggerText asli (abaikan strip/spasi/kapital),
// kalau ketemu yang mirip, betulin ke ejaan PERSIS yang terdaftar sebelum
// dikirim ke Botlab -- sisa argumennya di belakang tetap dipertahankan apa
// adanya.
function normalizeTriggerForMatch(t){
  return String(t || "").toLowerCase().replace(/^\//, "").replace(/[-_\s]/g, "");
}

function correctBotCommandTrigger(text, botCommands){
  if(!text || !Array.isArray(botCommands) || botCommands.length === 0) return text;

  const m = text.match(/^(\/?[^\s]+)(\s[\s\S]*)?$/);
  if(!m) return text;

  const rawTrigger = m[1];
  const rest = m[2] || "";
  const normalizedInput = normalizeTriggerForMatch(rawTrigger);

  // Match persis (setelah normalisasi) dulu -- kalau sudah pas, gak usah diubah.
  const exact = botCommands.find(c => normalizeTriggerForMatch(c.triggerText) === normalizedInput);
  if(exact) return (exact.triggerText || rawTrigger) + rest;

  return text;
}

// --- MODE DEBUG SEMENTARA ---------------------------------------------
// Biar ketauan PERSIS teks apa yang beneran dikirim ke CommandBot/Botlab
// (buat nelusurin kenapa "Perintah tidak dikenali" masih muncul walau
// prompt AI udah diperbaiki) -- tiap command yang dikirim bakal ikut
// ditampilin di chat. Set ke false kalau udah gak perlu lagi.
const DEBUG_SHOW_BOT_COMMAND_TEXT = true;

async function sendToCommandBot(text){
  const result = await apiRequest("/api/settings?action=botConsole", {
    method: "POST",
    body: JSON.stringify({ text, chatId: "web:" + chatOwner, username: chatOwner })
  });

  const debugPrefix = DEBUG_SHOW_BOT_COMMAND_TEXT
    ? `🔧 <i>[debug] dikirim ke CommandBot: "${text}"</i>\n\n`
    : "";

  if(!result || result.success === false){
    // Gagal total (mis. BOTLAB_API_URL belum diset) -- jangan anggap sesi
    // masih jalan, biar user tidak "nyangkut" harus /batal buat sesi yang
    // sebenarnya tidak pernah benar-benar mulai.
    setBotCommandSessionActive(false);
    chatData.push({ user:"SrinAI 🤖", text: debugPrefix + "⚠️ Gagal jalanin command lewat CommandBot: " + (result && result.message ? result.message : "kesalahan tidak diketahui") });
    saveChat(); loadChat();
    return false;
  }

  setBotCommandSessionActive(!!result.sessionActive);
  chatData.push({ user:"SrinAI 🤖", text: debugPrefix + (result.replyText || "(command tidak mengembalikan balasan)") });
  saveChat(); loadChat();
  return true;
}

async function runBotCommand(text, botCommands){
  const correctedText = correctBotCommandTrigger(text, botCommands);
  await sendToCommandBot(correctedText);
}

// Dipakai buat ACTION run_bot_command yang punya "steps" -- AI udah
// merangkum data yang user sebutkan jadi jawaban per-field berurutan,
// di sini kita "ketik-in" satu-satu ke CommandBot: trigger dulu buat
// mulai sesi, lalu tiap jawaban nunggu balasan bot sebelum lanjut ke
// field berikutnya (persis kayak user ngetik manual satu-satu, cuma
// otomatis). Berhenti duluan kalau sesinya udah ketutup (selesai/gagal)
// sebelum semua steps abis -- sisa data gak relevan lagi dikirim ke
// sesi yang udah gak aktif.
async function runBotCommandSequence(steps, botCommands){
  if(!Array.isArray(steps) || steps.length === 0) return;

  const correctedTrigger = correctBotCommandTrigger(steps[0], botCommands);
  const ok = await sendToCommandBot(correctedTrigger);
  if(!ok) return;

  for(const answer of steps.slice(1)){
    if(!botCommandSessionActive) break;

    showTypingIndicator();
    await new Promise(r => setTimeout(r, 450)); // jeda kecil biar kerasa natural, bukan nge-spam sekaligus
    removeTypingIndicator();

    const stepOk = await sendToCommandBot(answer);
    if(!stepOk) return;
  }
}

async function sendMessage(){
  const input = document.getElementById("message");
  const sendBtn = document.getElementById("sendBtn");
  const text = input.value.trim();
  if(!text) return;

  if(isAdmin() && adminView){
    chatData.push({ user:"Admin ("+currentUser+")", text:text });
    saveChat();
    loadChat();
    input.value="";
    return;
  }

  chatData.push({ user:currentUser, text:text });
  saveChat();
  loadChat();
  input.value="";

  // Sesi CommandBot lagi jalan (mis. di tengah alur /tambahtegakan yang
  // nanya beberapa isian satu-satu) -- pesan ini PASTI lanjutan buat
  // command itu, teruskan LANGSUNG ke CommandBot. AI TIDAK diajak bicara
  // sama sekali selama sesi berlangsung (termasuk kalau user ketik /batal).
  if(botCommandSessionActive){
    sendBtn.disabled = true;
    showTypingIndicator();
    try{
      await runBotCommand(text);
    } finally {
      removeTypingIndicator();
      sendBtn.disabled = false;
    }
    return;
  }

  if(!isRequestingBAGeneration(text) && isAskingForBA(text)){
    handleCariBA(text);
    return;
  }

  if(["edit","ubah","perbaiki","revisi"].some(k=>text.toLowerCase().includes(k))){
    const ticket = { id:Date.now(), from:currentUser, chatOwner:currentUser, request:text, status:"Menunggu" };
    requests.push(ticket);
    localStorage.setItem("aiRequests", JSON.stringify(requests));
    aiResponse("Duh, ribet banget 😵\n\nBentar ya, saya panggil dulu @Admin.");
    saveChat();
    loadChat();
    return;
  }

  sendBtn.disabled = true;
  showTypingIndicator();

  try{
    const result = await callGeminiBackend(text);
    removeTypingIndicator();
    aiResponse(result.reply);
    saveChat();
    loadChat();
    if(result.action){
      if(result.action.type === "run_bot_command" && (result.action.text || (Array.isArray(result.action.steps) && result.action.steps.length > 0))){
        const botCommandsCatalog = (result.appContext && result.appContext.botCommands) || [];
        if(Array.isArray(result.action.steps) && result.action.steps.length > 0){
          await runBotCommandSequence(result.action.steps, botCommandsCatalog);
        } else {
          await runBotCommand(result.action.text, botCommandsCatalog);
        }
      } else {
        handleGenerateBaAction(result.action, result.appContext);
      }
    }
  } catch(err){
    removeTypingIndicator();
    chatData.push({ user:"SrinAI 🤖", text:"⚠️ Maaf, saya sedang tidak bisa terhubung ke server AI. " + err.message });
    saveChat();
    loadChat();
  } finally {
    sendBtn.disabled = false;
  }
}

      const span = item.text.replace("NO_BA_LINK_","");
      area.innerHTML += `
        <div class="bubble-row theirs">
          <div class="sys-msg">
            <a href="sos.html?span=${span}" class="open-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>
              Buka SOS untuk Span ${span}
            </a>
          </div>
        </div>`;
      return;
    }

    if(item.user==="SYSTEM" && item.text.startsWith("GENERATE_BA_LINK_")){
      let info = null;
      try{ info = JSON.parse(item.text.replace("GENERATE_BA_LINK_","")); }catch(e){ info = null; }
      if(!info) return;
      area.innerHTML += `
        <div class="bubble-row theirs">
          <div class="sys-msg">
            <div class="ba-result-card">
              <div class="ba-result-meta">🤖 Siap digenerate</div>
              <div class="ba-result-title">${info.label}</div>
            </div>
            <a href="catatan-span.html?span=${encodeURIComponent(info.spanId)}&autoBA=1&mode=${encodeURIComponent(info.mode)}&ids=${encodeURIComponent(info.ids)}" class="open-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>
              Buat BA-nya sekarang
            </a>
          </div>
        </div>`;
      return;
    }

    if(item.user==="SYSTEM" && item.text.startsWith("BA_RESULTS_")){
      let results = [];
      try{ results = JSON.parse(item.text.replace("BA_RESULTS_","")); }catch(e){ results = []; }
      let html = `<div class="bubble-row theirs"><div class="sys-msg">`;
      results.forEach(r=>{
        html += `
          <div class="ba-result-card">
            <div class="ba-result-meta">${r.sumber==="ai" ? "🤖 Dibuat SrinAI" : "👤 Manual"} · ${r.tanggal}</div>
            <div class="ba-result-title">${r.judul || "BA Sosialisasi"}</div>
            ${r.pemilik && r.pemilik!=="-" ? `<div class="ba-result-owner">Pemilik: ${r.pemilik}</div>` : ""}
          </div>`;
      });
      html += `
        <a href="sos.html" class="open-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>
          Buka di SOS untuk lihat &amp; download
        </a>`;
      html += `</div></div>`;
      area.innerHTML += html;
      return;
    }

    const isMine = item.user===currentUser;
    const isAI = item.user==="SrinAI 🤖";
    const isAdminMsg = item.user && item.user.startsWith("Admin");

    let bubbleClass = "ai";
    if(isMine) bubbleClass = "mine";
    else if(isAdminMsg) bubbleClass = "admin";

    const rowSide = isMine ? "mine" : "theirs";
    const senderLabel = (!isMine) ? `<div class="bubble-sender">${item.user}</div>` : "";

    area.innerHTML += `
      <div class="bubble-row ${rowSide}">
        <div class="bubble ${bubbleClass}">${senderLabel}${item.text}</div>
      </div>`;
  });
  area.scrollTop = area.scrollHeight;
}
