<!DOCTYPE html>
<html lang="id">
<head>
  <meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#DED2AF">
<link rel="icon" href="/assets/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
<title>CommandBot — SRINAI ASSIST (Buku Log)</title>
<script src="js/auth.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700;800&family=JetBrains+Mono:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1EAD6;
  --paper-2:#E7DDC2;
  --paper-3:#DED2AF;
  --ink:#2B2A22;
  --ink-soft: rgba(43,42,34,0.62);
  --ink-faint: rgba(43,42,34,0.38);
  --route:#C1522A;
  --route-bg: rgba(193,82,42,0.1);
  --moss:#4F6B4A;
  --moss-bg: rgba(79,107,74,0.1);
  --line: rgba(43,42,34,0.18);
  --gold:#A8842E;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:'Inter',Arial,sans-serif;
  background:var(--paper-3);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
.container{
  max-width:460px;margin:auto;height:100vh;display:flex;flex-direction:column;
  background:
    radial-gradient(rgba(43,42,34,0.05) 1px, transparent 1px) 0 0/14px 14px,
    var(--paper);
  border-left:1px solid var(--line);border-right:1px solid var(--line);
  position:relative;overflow:hidden;
}
.mono{font-family:'JetBrains Mono',monospace;}
.hidden{display:none !important;}

/* ===== Header ===== */
.header{position:relative;flex-shrink:0;background:var(--paper);border-bottom:1.5px solid var(--ink);padding:16px 16px 14px;}
.header-row{display:flex;align-items:center;gap:11px;}
.back-circle{
  width:34px;height:34px;border-radius:50%;border:1.5px solid var(--ink);background:var(--paper);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;text-decoration:none;
}
.back-circle svg{width:15px;height:15px;stroke:var(--ink);}
.bot-avatar{
  width:34px;height:34px;border-radius:50%;flex-shrink:0;background:var(--paper);
  border:2px solid var(--route);display:flex;align-items:center;justify-content:center;font-size:15px;
}
.header-text{flex:1;min-width:0;}
.header-text h1{font-family:'Bitter';font-size:16px;font-weight:800;letter-spacing:-.2px;display:flex;align-items:center;gap:7px;color:var(--ink);}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--moss);box-shadow:0 0 0 0 rgba(79,107,74,.6);animation:livePulse 2s infinite;flex-shrink:0;}
@keyframes livePulse{
  0%{box-shadow:0 0 0 0 rgba(79,107,74,.5);}
  70%{box-shadow:0 0 0 6px rgba(79,107,74,0);}
  100%{box-shadow:0 0 0 0 rgba(79,107,74,0);}
}
.header-text p{font-family:'JetBrains Mono';font-size:10px;color:var(--ink-soft);margin-top:3px;letter-spacing:.3px;}
.menu-icon-btn{
  width:34px;height:34px;border-radius:50%;background:var(--paper);border:1.5px solid var(--ink);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:var(--ink);
}

.wire-strip{height:12px;flex-shrink:0;position:relative;overflow:hidden;background:var(--paper);}
.wire-strip svg{position:absolute;top:0;left:0;width:100%;height:100%;}

/* Badge status sinkronisasi */
.sync-badge{
  margin:12px 14px 0;padding:9px 12px;border:1.5px dashed var(--ink);font-size:11px;line-height:1.5;
  color:var(--ink-soft);display:flex;gap:8px;align-items:flex-start;font-family:'Inter';
}
.sync-badge svg{flex-shrink:0;margin-top:1px;stroke:var(--gold);}
.sync-badge.connected{border-color:var(--moss);}
.sync-badge.connected svg{stroke:var(--moss);}
.sync-badge.error{border-color:var(--route);}
.sync-badge.error svg{stroke:var(--route);}

/* ===== Chat area ===== */
.chat-area{flex:1;overflow-y:auto;padding:14px 14px 10px;display:flex;flex-direction:column;gap:3px;}

.row{display:flex;width:100%;margin-bottom:9px;}
.row.mine{justify-content:flex-end;}
.row.theirs{justify-content:flex-start;}

.bubble-wrap{max-width:82%;display:flex;flex-direction:column;}
.row.mine .bubble-wrap{align-items:flex-end;}
.row.theirs .bubble-wrap{align-items:flex-start;}

.sender-name{font-family:'JetBrains Mono';font-size:10px;font-weight:700;margin-bottom:3px;padding:0 4px;color:var(--moss);letter-spacing:.3px;text-transform:uppercase;}

.bubble{
  padding:11px 14px;font-size:13.5px;line-height:1.55;
  word-wrap:break-word;white-space:pre-wrap;position:relative;
}
.row.mine .bubble{
  background:var(--route);color:var(--paper);border:1.5px solid var(--ink);
}
.row.theirs .bubble{
  background:var(--paper);color:var(--ink);border:1.5px dashed var(--ink);
}
.bubble.typing{display:flex;align-items:center;gap:5px;padding:12px 14px;}
.typing-dot{width:6px;height:6px;border-radius:50%;background:var(--moss);opacity:.5;animation:typingBlink 1.2s infinite;}
.typing-dot:nth-child(2){animation-delay:.2s;}
.typing-dot:nth-child(3){animation-delay:.4s;}
@keyframes typingBlink{0%,80%,100%{opacity:.3;transform:scale(.8);}40%{opacity:1;transform:scale(1);}}

/* Menu angka sebagai chip yang bisa ditap langsung */
.menu-chips{display:flex;flex-direction:column;gap:6px;margin-top:10px;}
.menu-chip{
  display:flex;align-items:center;gap:9px;background:var(--paper-2);
  border:1px solid var(--line);padding:8px 10px;
  cursor:pointer;text-align:left;font-family:inherit;color:var(--ink);
}
.menu-chip:active{background:var(--paper-3);}
.menu-chip .num{
  width:22px;height:22px;border-radius:50%;background:var(--paper);color:var(--route);
  border:1.5px solid var(--route);font-family:'JetBrains Mono';font-weight:700;font-size:11px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.menu-chip .txt{font-size:12.5px;font-weight:600;}

.meta-row{display:flex;align-items:center;gap:6px;margin-top:4px;padding:0 4px;}
.bubble-time{font-family:'JetBrains Mono';font-size:9.5px;color:var(--ink-faint);}

/* ===== Input area ===== */
.input-area{
  flex-shrink:0;background:var(--paper);padding:10px 12px 12px;
  border-top:1.5px solid var(--ink);
}
.input-row{display:flex;align-items:flex-end;gap:8px;}
.text-input-wrap{flex:1;background:var(--paper-2);border:1.5px solid var(--ink);padding:2px 4px 2px 14px;display:flex;align-items:flex-end;}
textarea{
  flex:1;background:transparent;border:none;color:var(--ink);font-family:'Inter';
  font-size:13.5px;padding:10px 4px;resize:none;max-height:100px;outline:none;
}
textarea::placeholder{color:var(--ink-faint);}
.send-btn{
  width:42px;height:42px;border-radius:50%;background:var(--route);border:1.5px solid var(--ink);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:transform .12s;
}
.send-btn:active{transform:scale(.92);}
.send-btn:disabled{opacity:.45;cursor:not-allowed;}
.hint-row{font-family:'JetBrains Mono';font-size:9.5px;color:var(--ink-faint);margin-top:7px;padding:0 6px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.cancel-btn{
  flex-shrink:0;background:var(--paper);border:1.5px solid var(--route);color:var(--route);
  font-family:'JetBrains Mono';font-size:9.5px;font-weight:700;padding:5px 10px;cursor:pointer;
}
.cancel-btn:active{background:var(--route-bg);}
</style>
</head>
<body>

<div class="container">

  <div class="header">
    <div class="header-row">
      <a href="dashboard-fieldlog.html" class="back-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <div class="bot-avatar">🤖</div>
      <div class="header-text">
        <h1><span class="live-dot"></span>CommandBot</h1>
        <p id="userInfo"></p>
      </div>
      <button class="menu-icon-btn" onclick="showMenu(true)" title="Lihat daftar command">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
      </button>
    </div>
  </div>

  <div class="wire-strip">
    <svg preserveAspectRatio="none" viewBox="0 0 400 14"><path d="M0 7 Q 50 14, 100 7 T 200 7 T 300 7 T 400 7" stroke="#DED2AF" stroke-width="1.5" fill="none" opacity="0.9"/></svg>
  </div>

  <div class="sync-badge" id="syncBadge">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
    <span>Menyambungkan ke Ruang Kerja SrinAI...</span>
  </div>

  <div id="chatArea" class="chat-area"></div>

  <div class="input-area">
    <div class="input-row">
      <div class="text-input-wrap">
        <textarea id="message" placeholder="Ketik nomor atau command... misal: 1" rows="1" oninput="autoGrow(this)"></textarea>
      </div>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24" fill="none" stroke="#F1EAD6" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </div>
    <div class="hint-row">
      <span>Ketik "menu" kapan saja untuk lihat daftar ulang</span>
      <button class="cancel-btn" type="button" onclick="cancelFlow()">✕ Batal</button>
    </div>
  </div>

</div>

<script>
let currentUser, currentRole, consoleChatId;

/*
 * Sama seperti command-bot.html (tema klasik): daftar command diambil live dari
 * /api/settings?action=botCommands, difilter yang status-nya "live" di Botlab.
 * Balasan tiap command diambil live dari /api/settings?action=botConsole
 * (dikirim ke bot Telegram/Botlab, bukan simulasi).
 */
let botCommands = [];

const GREETING_INTRO = "Halo! Data apa yang mau kamu cek atau kerjakan? Balas dengan angkanya:";
const BOT_NAME = "CommandBot";

async function initPage(){
  if(localStorage.getItem("srinai_theme") !== "fieldlog"){
    location.href = "command-bot.html";
    return;
  }

  if(!(await isLoggedIn())){
    location.href = "index-fieldlog.html";
    return;
  }

  currentUser = getCurrentUser();
  currentRole = getCurrentRole();
  document.getElementById("userInfo").innerHTML = currentUser + " · " + currentRole.toUpperCase();
  consoleChatId = "web:" + currentUser;

  await loadCommands();
  showMenu(false);
  startIdleWatcher();
  await loadDailyRecap();
}

/*
 * TAHAP 3 — RESET OTOMATIS SESI IDLE + REKAP HARIAN + NOTIF BELUM TERBACA
 *
 * 1) Reset idle: kalau tidak ada aktivitas (ketik/kirim) selama 30 menit,
 *    kirim "/batal" diam-diam ke Botlab supaya sesi command multi-langkah
 *    (mis. /catatan yang lagi nunggu balasan) ikut direset di server --
 *    jadi tidak nyangkut kalau user balik lagi nanti.
 * 2) Rekap harian: setiap kali halaman ini dibuka, tanya /api/settings?action=botNotify
 *    apakah ada notif belum terbaca untuk user ini. Notif jenis
 *    "span_belum_tegakan" (dibuat oleh cron harian, lihat vercel.json +
 *    api/settings.js) ditampilkan sebagai pesan bot otomatis berisi
 *    daftar span yang belum ada tegakannya + link langsung ke
 *    catatan-span.html buat bikin tegakan baru.
 * 3) Setelah rekap ditampilkan, notif ditandai terbaca -- ini juga yang
 *    menghentikan getar ikon CommandBot di dashboard-fieldlog.html.
 */
let lastActivityAt = Date.now();
let idleResetTriggered = false;
const IDLE_LIMIT_MS = 30 * 60 * 1000; // 30 menit

function markActivity(){
  lastActivityAt = Date.now();
  idleResetTriggered = false;
}

function startIdleWatcher(){
  setInterval(async () => {
    if(idleResetTriggered) return;
    if(Date.now() - lastActivityAt >= IDLE_LIMIT_MS){
      idleResetTriggered = true;
      await autoResetIdleSession();
    }
  }, 30 * 1000); // cek tiap 30 detik, cukup presisi untuk batas 30 menit
}

async function autoResetIdleSession(){
  try {
    await apiRequest("/api/settings?action=botConsole", {
      method: "POST",
      body: JSON.stringify({ text: "/batal", chatId: consoleChatId, username: currentUser }),
    });
  } catch(e){ /* diamkan -- reset idle tidak boleh ganggu UX kalau gagal */ }
  addBotRow("⏱️ Sesi kamu direset otomatis karena tidak ada aktivitas selama 30 menit. Ketik <b>menu</b> kalau mau mulai lagi.");
}

async function loadDailyRecap(){
  const result = await apiRequest("/api/settings?action=botNotify&username=" + encodeURIComponent(currentUser), { method: "GET" });
  if(!result.success || !result.notifications || result.notifications.length === 0) return;

  const recap = result.notifications.find(n => n.type === "span_belum_tegakan");
  const spans = recap && recap.payload && recap.payload.spans || [];

  if(spans.length > 0){
    const list = spans.map(s =>
      `• ${escapeHtml(jalurLabel(s.jalurId))} — Span #${s.nomor} ` +
      `<a href="catatan-span.html?span=${encodeURIComponent(s.id)}" style="color:var(--moss);font-weight:700;">Buat tegakan →</a>`
    ).join("<br>");
    addBotRow(
      `📋 <b>Rekap harian</b> — kamu punya <b>${spans.length}</b> span yang belum ada tegakannya:<br><br>${list}` +
      `<br><br>Yuk lengkapi tegakannya biar datanya rapi 🙌`
    );
  }

  // Tandai semua notif user ini sudah dibaca (juga menghentikan getar
  // ikon CommandBot di dashboard untuk kunjungan berikutnya).
  await apiRequest("/api/settings?action=botNotifyRead", {
    method: "POST",
    body: JSON.stringify({ username: currentUser }),
  });
}

async function loadCommands(){
  const badge = document.getElementById("syncBadge");
  const result = await apiRequest("/api/settings?action=botCommands", { method: "GET" });

  if(!result.success){
    botCommands = [];
    badge.className = "sync-badge error";
    badge.innerHTML =
      `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>` +
      `<span>Gagal sinkron ke Ruang Kerja SrinAI: ${escapeHtml(result.message || "kesalahan tidak diketahui")}. Kamu masih bisa ketik command, tapi menu nomor di bawah belum bisa dimuat.</span>`;
    return;
  }

  botCommands = (result.commands || []).filter(c => c.status === "live");
  badge.className = "sync-badge connected";
  badge.innerHTML =
    `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>` +
    `<span>Tersambung ke Ruang Kerja SrinAI — ${botCommands.length} command live siap dipakai. Balasan diambil langsung dari Botlab.</span>`;
}

function getTimeLabel(){
  return new Date().toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});
}

function autoGrow(el){
  markActivity();
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 100) + "px";
}

function scrollToBottom(){
  const area = document.getElementById("chatArea");
  area.scrollTop = area.scrollHeight;
}

function addBotRow(html){
  const area = document.getElementById("chatArea");
  const row = document.createElement("div");
  row.className = "row theirs";
  row.innerHTML = `
    <div class="bubble-wrap">
      <div class="sender-name">${BOT_NAME}</div>
      <div class="bubble">${html}</div>
      <div class="meta-row"><span class="bubble-time">${getTimeLabel()}</span></div>
    </div>`;
  area.appendChild(row);
  scrollToBottom();
}

function addMyRow(text){
  const area = document.getElementById("chatArea");
  const row = document.createElement("div");
  row.className = "row mine";
  row.innerHTML = `
    <div class="bubble-wrap">
      <div class="bubble">${escapeHtml(text)}</div>
      <div class="meta-row"><span class="bubble-time">${getTimeLabel()}</span></div>
    </div>`;
  area.appendChild(row);
  scrollToBottom();
}

function menuChipsHtml(){
  if(botCommands.length === 0){
    return `<div class="menu-chips"><div class="menu-chip" style="cursor:default;"><span class="txt">Belum ada command live dari Ruang Kerja SrinAI saat ini.</span></div></div>`;
  }
  return `<div class="menu-chips">` + botCommands.map((c, i) =>
    `<button class="menu-chip" onclick="pickNumber(${i + 1})">
      <span class="num">${i + 1}</span><span class="txt">${escapeHtml(c.name || c.description || c.triggerText)}</span>
    </button>`
  ).join("") + `</div>`;
}

function showMenu(asReply){
  if(!asReply){
    addBotRow(escapeHtml(GREETING_INTRO) + menuChipsHtml());
  } else {
    addBotRow("Ini daftar command yang ada sekarang:" + menuChipsHtml());
  }
}

function showTyping(){
  const area = document.getElementById("chatArea");
  const row = document.createElement("div");
  row.className = "row theirs";
  row.id = "botTypingIndicator";
  row.innerHTML = `
    <div class="bubble-wrap">
      <div class="sender-name">${BOT_NAME}</div>
      <div class="bubble typing">
        <span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>
      </div>
    </div>`;
  area.appendChild(row);
  scrollToBottom();
}
function removeTyping(){
  const el = document.getElementById("botTypingIndicator");
  if(el) el.remove();
}

function cancelFlow(){
  document.getElementById("message").value = "/batal";
  sendMessage();
}

function pickNumber(n){
  const cmd = botCommands[n - 1];
  document.getElementById("message").value = cmd ? (cmd.triggerText || String(n)) : String(n);
  sendMessage();
}

async function sendMessage(){
  markActivity();
  const input = document.getElementById("message");
  const text = input.value.trim();
  if(!text) return;

  addMyRow(text);
  input.value = "";
  autoGrow(input);

  const lower = text.toLowerCase();
  if(lower === "menu" || lower === "help" || lower === "bantuan"){
    showMenu(true);
    return;
  }

  const sendBtn = document.getElementById("sendBtn");
  sendBtn.disabled = true;
  showTyping();

  const result = await apiRequest("/api/settings?action=botConsole", {
    method: "POST",
    body: JSON.stringify({ text, chatId: consoleChatId, username: currentUser }),
  });

  removeTyping();

  if(!result.success){
    addBotRow(
      `⚠️ Gagal menghubungi Botlab: ${escapeHtml(result.message || "kesalahan tidak diketahui")}.<br>` +
      `Coba lagi, atau ketik <b>menu</b> untuk lihat daftar command.`
    );
  } else {
    addBotRow(escapeHtml(result.replyText || "(tidak ada balasan dari bot)"));
  }

  sendBtn.disabled = false;
}

function escapeHtml(str){
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

document.getElementById("message").addEventListener("keydown", function(e){
  if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});

initPage();
</script>

</body>
</html>
