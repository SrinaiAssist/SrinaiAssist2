name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install project dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Apply custom native code (hide navigation bar + background location)
        run: |
          cp android-native/MainActivity.java android/app/src/main/java/com/srinai/assist/MainActivity.java
          cp android-native/LocationTrackerPlugin.java android/app/src/main/java/com/srinai/assist/LocationTrackerPlugin.java
          cp android-native/LocationTrackingService.java android/app/src/main/java/com/srinai/assist/LocationTrackingService.java
          cp android-native/google-services.json android/app/google-services.json
          node scripts/patch-android-manifest.js
          node scripts/patch-android-gradle.js

      - name: Generate app icon from resources/icon.png
        run: npx capacitor-assets generate --android

      - name: Sync web config into Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: srinai-assist-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
