<!DOCTYPE html>
<html lang="id" class="theme-fieldlog">
<head>
  <meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0B1220">
<link rel="icon" href="/assets/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
<title>Master Data Jalur - SRINAI ASSIST</title>
<script src="js/auth.js"></script>
<script src="js/sync.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-deep:   #080F1E;
  --bg-card:   #0D1830;
  --bg-card2:  #111E35;
  --bg-glass:  rgba(255,255,255,0.06);
  --border:    rgba(255,255,255,0.09);
  --gold:      #F4C542;
  --gold-dim:  rgba(244,197,66,0.15);
  --blue:      #4A8EF5;
  --blue-glow: rgba(74,142,245,0.25);
  --teal:      #38BFA0;
  --ink:       #FFFFFF;
  --ink-2:     rgba(255,255,255,0.65);
  --ink-3:     rgba(255,255,255,0.38);
  --green:     #2DD4A0;
  --green-bg:  rgba(45,212,160,0.15);
  --amber:     #F4C542;
  --amber-bg:  rgba(244,197,66,0.12);
  --red:       #F26B6B;
  --red-bg:    rgba(242,107,107,0.13);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:'Plus Jakarta Sans',Arial,sans-serif;
  background:var(--bg-deep);color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
.container{max-width:460px;margin:auto;min-height:100vh;background:var(--bg-deep);padding-bottom:60px;position:relative;overflow-x:hidden;}

/* Ambient glow */
.bg-glow{
  position:fixed;top:0;left:0;right:0;max-width:460px;margin:auto;height:300px;
  background:radial-gradient(ellipse 80% 60% at 50% 0%, rgba(74,142,245,0.13) 0%, transparent 70%);
  pointer-events:none;z-index:0;
}

/* Top Bar */
.topbar{
  position:relative;z-index:2;
  display:flex;align-items:center;gap:12px;padding:20px 20px 0;
}
.back-btn{
  width:38px;height:38px;border-radius:12px;flex-shrink:0;
  background:var(--bg-glass);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;
}
.topbar-title{flex:1;}
.topbar-title h1{font-size:17px;font-weight:800;color:var(--ink);letter-spacing:-0.3px;}
.topbar-title p{font-size:11px;color:var(--ink-3);margin-top:2px;}

/* Breadcrumb */
.crumb{
  position:relative;z-index:2;
  display:flex;align-items:center;gap:6px;
  margin:12px 20px 0;
  font-size:11.5px;font-weight:600;color:var(--ink-3);
}
.crumb b{color:var(--teal);}
.crumb-sep{opacity:.4;}

/* Add card */
.add-card{
  position:relative;z-index:2;
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:18px;padding:18px;margin:16px 20px 0;
  box-shadow:0 4px 20px rgba(0,0,0,0.3);
}
.card-title{
  font-size:10px;font-weight:700;color:var(--ink-3);
  text-transform:uppercase;letter-spacing:.8px;
  display:flex;align-items:center;gap:6px;margin-bottom:14px;
}
.card-title::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--blue);display:block;}

.form-row{margin-bottom:12px;}
.form-label{display:block;font-size:11.5px;font-weight:700;color:var(--ink-2);margin-bottom:6px;}
.form-input{
  width:100%;padding:11px 13px;border:1px solid var(--border);
  border-radius:11px;font-size:13.5px;font-family:inherit;
  background:var(--bg-card2);color:var(--ink);outline:none;
}
.form-input:focus{border-color:rgba(74,142,245,0.45);}
.form-input::placeholder{color:var(--ink-3);}
.form-hint{font-size:11px;color:var(--ink-3);margin-top:4px;line-height:1.5;}

.code-preview{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(74,142,245,0.12);color:var(--blue);
  font-weight:800;font-size:12.5px;padding:6px 12px;border-radius:8px;
  margin-top:6px;font-family:monospace;letter-spacing:.5px;
  border:1px solid rgba(74,142,245,0.2);
}

.btn-primary{
  width:100%;padding:13px;background:var(--blue);color:white;border:none;
  border-radius:12px;font-weight:700;font-size:13.5px;cursor:pointer;
  font-family:inherit;margin-top:4px;transition:opacity .15s;
}
.btn-primary:active{opacity:.85;}

/* Readonly notice */
.readonly-notice{
  position:relative;z-index:2;
  margin:16px 20px 0;
  background:var(--amber-bg);border-left:3px solid var(--amber);
  color:var(--amber);padding:11px 14px;border-radius:12px;
  font-size:12.5px;line-height:1.5;
}

/* Section label */
.section-head{
  position:relative;z-index:2;
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 20px 0;
}
.section-title{
  font-size:10px;font-weight:700;color:var(--ink-3);
  text-transform:uppercase;letter-spacing:.8px;
  display:flex;align-items:center;gap:6px;
}
.section-title::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--blue);display:block;}
.section-count{
  font-size:11px;font-weight:700;color:var(--blue);
  background:var(--blue-glow);border:1px solid rgba(74,142,245,0.2);
  padding:3px 10px;border-radius:20px;
}

/* Jalur list */
.list-wrap{position:relative;z-index:2;padding:12px 20px 4px;}

.jalur-card{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:18px;padding:15px 16px;margin-bottom:12px;
  box-shadow:0 4px 16px rgba(0,0,0,0.25);
  overflow:hidden;position:relative;
}
.jalur-card::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--blue);border-radius:3px 0 0 3px;
}
.jalur-card.nonaktif::before{background:var(--ink-3);}

.jalur-top{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.jalur-code-badge{
  width:50px;height:50px;border-radius:14px;flex-shrink:0;
  background:var(--blue-glow);border:1px solid rgba(74,142,245,0.22);
  display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:12px;color:var(--blue);letter-spacing:.5px;
}
.jalur-card.nonaktif .jalur-code-badge{background:var(--bg-card2);border-color:var(--border);color:var(--ink-3);}
.jalur-info{flex:1;min-width:0;}
.jalur-name{font-size:14.5px;font-weight:800;color:var(--ink);letter-spacing:-0.2px;}
.jalur-id{font-size:10px;color:var(--ink-3);font-family:monospace;margin-top:2px;}
.status-chip{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;}
.status-aktif{background:var(--green-bg);color:var(--green);}
.status-nonaktif{background:var(--bg-card2);color:var(--ink-3);border:1px solid var(--border);}

.jalur-stats{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;
}
.jalur-stat{
  background:var(--bg-card2);border-radius:11px;padding:10px 12px;
  display:flex;align-items:center;gap:10px;border:1px solid var(--border);
}
.jalur-stat-icon{
  width:28px;height:28px;border-radius:8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.jalur-stat-icon.tower-icon{background:rgba(74,142,245,0.15);}
.jalur-stat-icon.span-icon{background:rgba(56,191,160,0.15);}
.jalur-stat-text{}
.jalur-stat-num{font-size:15px;font-weight:800;color:var(--ink);}
.jalur-stat-label{font-size:9.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.4px;font-weight:600;}

.jalur-actions{display:flex;gap:8px;}
.act-btn{
  flex:1;padding:10px;border-radius:11px;border:none;
  font-size:12px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:5px;
  font-family:inherit;transition:opacity .15s;
}
.act-btn:active{opacity:.8;}
.act-edit{background:var(--blue-glow);color:var(--blue);border:1px solid rgba(74,142,245,0.2);}
.act-toggle-on{background:var(--amber-bg);color:var(--amber);border:1px solid rgba(244,197,66,0.2);}
.act-toggle-off{background:var(--green-bg);color:var(--green);border:1px solid rgba(45,212,160,0.2);}

.jalur-nav-btn{
  width:100%;padding:10px;border-radius:11px;border:1px solid var(--border);
  background:var(--bg-glass);color:var(--ink-2);
  font-size:12px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;
  margin-top:8px;font-family:inherit;transition:background .15s;
}
.jalur-nav-btn:active{background:rgba(255,255,255,0.1);}

.empty-msg{
  text-align:center;color:var(--ink-3);padding:50px 20px;font-size:13px;
  position:relative;z-index:2;
}

/* Skeleton */
.skeleton{
  height:160px;border-radius:18px;margin:0 20px 12px;
  background:linear-gradient(90deg,var(--bg-card) 25%,var(--bg-card2) 50%,var(--bg-card) 75%);
  background-size:200% 100%;
  animation:shimmer 1.4s infinite;
  position:relative;z-index:2;
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center;z-index:50;backdrop-filter:blur(4px);}
.modal-overlay.active{display:flex;}
.modal-box{
  background:var(--bg-card);border-radius:24px 24px 0 0;
  border-top:1px solid rgba(255,255,255,0.1);
  padding:22px 20px 32px;width:100%;max-width:460px;max-height:85vh;overflow-y:auto;
}
.modal-handle{width:36px;height:4px;background:rgba(255,255,255,.15);border-radius:2px;margin:0 auto 18px;}
.modal-title{font-size:17px;font-weight:800;color:var(--ink);margin-bottom:4px;}
.modal-sub{font-size:12.5px;color:var(--ink-3);margin-bottom:16px;}
.modal-actions{display:flex;gap:10px;margin-top:16px;}
.modal-btn-cancel{flex:1;padding:13px;border:1px solid var(--border);border-radius:12px;background:var(--bg-card2);color:var(--ink-2);font-weight:700;cursor:pointer;font-family:inherit;}
.modal-btn-save{flex:2;padding:13px;border:none;border-radius:12px;background:var(--blue);color:white;font-weight:700;cursor:pointer;font-family:inherit;}

/* Generate modal specific */
.gen-section{
  background:var(--bg-card2);border-radius:14px;padding:14px;margin-bottom:12px;
  border:1px solid var(--border);
}
.gen-section-title{
  font-size:11.5px;font-weight:700;color:var(--ink-2);
  margin-bottom:10px;display:flex;align-items:center;gap:6px;
}
.gen-row{display:flex;gap:8px;}
.gen-row .form-row{flex:1;margin-bottom:0;}
.gen-result{
  margin-top:8px;font-size:11.5px;color:var(--teal);font-weight:600;min-height:16px;
}
.gen-result.warn{color:var(--red);}
.btn-gen{
  width:100%;padding:13px;background:linear-gradient(135deg,var(--teal) 0%,#2ea88a 100%);
  color:white;border:none;border-radius:12px;
  font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit;margin-top:4px;
}
</style>

<body>

<div class="bg-glow"></div>
<div class="container">

  <div class="topbar">
    <a href="dashboard.html" class="back-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" width="17" height="17"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div class="topbar-title">
      <h1>Master Data</h1>
      <p>Kelola jalur transmisi</p>
    </div>
  </div>

  <div class="crumb">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="12" height="12"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1V10"/></svg>
    Master Data <span class="crumb-sep">›</span> <b>Jalur</b>
  </div>

  <div id="addCardWrap"></div>

  <div class="section-head">
    <div class="section-title">Daftar Jalur</div>
    <div class="section-count" id="jalurCountBadge">—</div>
  </div>

  <div class="list-wrap" id="jalurList">
    <div class="skeleton"></div>
    <div class="skeleton" style="opacity:.6;height:120px;margin-top:0;"></div>
  </div>

</div>

<!-- Modal Edit Jalur -->
<div class="modal-overlay" id="modalEdit">
  <div class="modal-box">
    <div class="modal-handle"></div>
    <div class="modal-title">Edit Jalur</div>
    <div class="modal-sub">Perubahan kode jalur akan mempengaruhi tampilan asset code tower & span.</div>
    <div class="form-row">
      <label class="form-label">Nama Jalur</label>
      <input type="text" id="editLabel" class="form-input" placeholder="Nama jalur">
    </div>
    <div class="form-row">
      <label class="form-label">Kode Jalur (3-5 huruf)</label>
      <input type="text" id="editCode" class="form-input" maxlength="5" style="text-transform:uppercase;" placeholder="Contoh: LCJ">
      <div class="form-hint">Contoh: kode LCJ → asset code <span style="color:var(--blue);font-family:monospace;">LCJ-T025</span></div>
    </div>
    <div class="modal-actions">
      <button class="modal-btn-cancel" onclick="closeEditModal()">Batal</button>
      <button class="modal-btn-save" onclick="saveEditJalur()">💾 Simpan</button>
    </div>
  </div>
</div>

<!-- Modal Generate Tower & Span -->
<div class="modal-overlay" id="modalGenerate">
  <div class="modal-box">
    <div class="modal-handle"></div>
    <div class="modal-title" id="genModalTitle">Generate Tower & Span</div>
    <div class="modal-sub" id="genModalSub">Buat tower dan span massal. Data yang sudah ada tidak akan ditimpa.</div>

    <div class="gen-section">
      <div class="gen-section-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="#4A8EF5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M12 2L4 9h16l-8-7z"/><path d="M6 9l-2 13M18 9l2 13M5 15h14"/></svg>
        Tower
      </div>
      <div class="gen-row">
        <div class="form-row">
          <label class="form-label">Dari Nomor</label>
          <input type="number" id="genTowerDari" class="form-input" placeholder="1" min="1" oninput="previewGenerate()">
        </div>
        <div class="form-row">
          <label class="form-label">Sampai Nomor</label>
          <input type="number" id="genTowerSampai" class="form-input" placeholder="122" min="1" oninput="previewGenerate()">
        </div>
      </div>
      <div class="gen-result" id="genTowerResult"></div>
    </div>

    <div class="gen-section">
      <div class="gen-section-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="#38BFA0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8 16.5L16 7.5"/></svg>
        Span
      </div>
      <div class="gen-row">
        <div class="form-row">
          <label class="form-label">Dari Nomor</label>
          <input type="number" id="genSpanDari" class="form-input" placeholder="1" min="1" oninput="previewGenerate()">
        </div>
        <div class="form-row">
          <label class="form-label">Sampai Nomor</label>
          <input type="number" id="genSpanSampai" class="form-input" placeholder="121" min="1" oninput="previewGenerate()">
        </div>
      </div>
      <div class="gen-result" id="genSpanResult"></div>
    </div>

    <div class="modal-actions">
      <button class="modal-btn-cancel" onclick="closeGenerateModal()">Batal</button>
      <button class="btn-gen" id="genSaveBtn" onclick="runGenerate()">⚡ Generate Sekarang</button>
    </div>
  </div>
</div>

<script>
let canEdit = false;

/* ── Invalidate cache jalur/tower/span setelah setiap perubahan ── */
function invalidateMasterCache() {
  localStorage.removeItem("srinai_cache_jalur");
  localStorage.removeItem("srinai_cache_tower");
  localStorage.removeItem("srinai_cache_span");
}

async function initPage(){
  if(!(await isLoggedIn())){ location.href="index.html"; return; }
  if(!isAdmin() && !isKLW()){ alert("Akses ditolak."); location.href="dashboard.html"; return; }
  canEdit = isAdmin();
  buildAddCard();
  await loadJalurList();
}

/* ── Form tambah jalur ── */
function buildAddCard(){
  const wrap = document.getElementById("addCardWrap");
  if(!canEdit){
    wrap.innerHTML = `<div class="readonly-notice">👁 Anda login sebagai KLW — hanya dapat melihat daftar jalur. Penambahan dan perubahan dilakukan oleh Admin.</div>`;
    return;
  }
  wrap.innerHTML = `
    <div class="add-card">
      <div class="card-title">Tambah Jalur Baru</div>
      <div class="form-row">
        <label class="form-label">Nama Jalur</label>
        <input type="text" id="newLabel" class="form-input" placeholder="Contoh: Lembursitu - Sukabumi" oninput="updateCodePreview()">
      </div>
      <div class="form-row">
        <label class="form-label">Kode Jalur (opsional, otomatis dari nama)</label>
        <input type="text" id="newCode" class="form-input" placeholder="Misal: LCJ" maxlength="5" style="text-transform:uppercase;" oninput="updateCodePreview()">
        <div id="codePreviewWrap"></div>
        <div class="form-hint">Kode dipakai untuk asset code: <span style="color:var(--blue);font-family:monospace;">LCJ-T025</span>, <span style="color:var(--teal);font-family:monospace;">LCJ-S001</span></div>
      </div>
      <button class="btn-primary" onclick="addJalur()">➕ Tambah Jalur</button>
    </div>`;
}

function suggestCode(label){
  const words = label.trim().split(/\s+/).filter(w=>w.length>0);
  if(!words.length) return "";
  if(words.length===1) return words[0].slice(0,3).toUpperCase();
  return words.map(w=>w[0]).join("").slice(0,4).toUpperCase();
}

function updateCodePreview(){
  const label = document.getElementById("newLabel").value;
  const codeInput = document.getElementById("newCode");
  const preview = document.getElementById("codePreviewWrap");
  if(!preview) return;
  const code = codeInput.value.trim() || suggestCode(label);
  if(code){
    preview.innerHTML = `<div class="code-preview">${code} → ${code}-T025 / ${code}-S001</div>`;
  } else {
    preview.innerHTML = "";
  }
}

/* ── Load daftar jalur (SELALU fresh dari server) ── */
async function loadJalurList(){
  const wrap = document.getElementById("jalurList");

  // PENTING: Selalu fetch langsung dari server (bukan cache) supaya
  // data terbaru (tower_count, span_count) selalu tampil benar.
  const result = await apiRequest("/api/jalur");
  const data = result.jalur ? result.jalur.map(j => ({
    id: j.id, code: j.code, label: j.label, aktif: j.aktif,
    towerCount: Number(j.tower_count) || 0,
    spanCount: Number(j.span_count) || 0
  })) : [];

  // Update cache dengan data fresh
  try{ localStorage.setItem("srinai_cache_jalur", JSON.stringify({ts:Date.now(),data})); }catch(e){}

  document.getElementById("jalurCountBadge").textContent = data.length + " jalur";
  wrap.innerHTML = "";

  if(!data.length){
    wrap.innerHTML = `<div class="empty-msg">🛤 Belum ada jalur.<br>Tambahkan jalur pertama di atas.</div>`;
    return;
  }

  data.forEach(j=>{
    const card = document.createElement("div");
    card.className = "jalur-card" + (j.aktif ? "" : " nonaktif");
    card.innerHTML = `
      <div class="jalur-top">
        <div class="jalur-code-badge">${j.code}</div>
        <div class="jalur-info">
          <div class="jalur-name">${j.label}</div>
          <div class="jalur-id">ID: ${j.id}</div>
        </div>
        <div class="status-chip ${j.aktif ? 'status-aktif' : 'status-nonaktif'}">${j.aktif ? 'Aktif' : 'Nonaktif'}</div>
      </div>
      <div class="jalur-stats">
        <div class="jalur-stat">
          <div class="jalur-stat-icon tower-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#4A8EF5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M12 2L4 9h16l-8-7z"/><path d="M6 9l-2 13M18 9l2 13M5 15h14"/></svg>
          </div>
          <div class="jalur-stat-text">
            <div class="jalur-stat-num">${j.towerCount}</div>
            <div class="jalur-stat-label">Tower</div>
          </div>
        </div>
        <div class="jalur-stat">
          <div class="jalur-stat-icon span-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#38BFA0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8 16.5L16 7.5"/></svg>
          </div>
          <div class="jalur-stat-text">
            <div class="jalur-stat-num">${j.spanCount}</div>
            <div class="jalur-stat-label">Span</div>
          </div>
        </div>
      </div>
      ${canEdit ? `
      <div class="jalur-actions">
        <button class="act-btn act-edit" onclick="openEditModal('${j.id}')">
          ✏️ Edit
        </button>
        <button class="act-btn ${j.aktif ? 'act-toggle-on' : 'act-toggle-off'}" onclick="toggleJalurStatus('${j.id}')">
          ${j.aktif ? '⏸ Nonaktifkan' : '▶ Aktifkan'}
        </button>
      </div>
      <button class="jalur-nav-btn" onclick="openGenerateModal('${j.id}')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><path d="M13 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V9z"/><path d="M13 2v7h7"/></svg>
        ⚡ Generate Tower & Span
      </button>` : ""}
    `;
    wrap.appendChild(card);
  });
}

async function addJalur(){
  const label = document.getElementById("newLabel").value.trim();
  let code = document.getElementById("newCode").value.trim().toUpperCase();
  if(!label){ alert("Nama jalur wajib diisi."); return; }
  if(!code) code = suggestCode(label);
  if(!code){ alert("Kode tidak dapat dibuat otomatis, isi manual."); return; }

  const result = await apiRequest("/api/jalur", {
    method:"POST",
    body: JSON.stringify({ id:"route_"+Date.now(), code, label, aktif:true })
  });

  if(!result.success){ alert(result.message || "Gagal menambahkan jalur."); return; }

  document.getElementById("newLabel").value = "";
  document.getElementById("newCode").value = "";
  document.getElementById("codePreviewWrap").innerHTML = "";

  invalidateMasterCache();
  await loadJalurList();
  alert(`Jalur "${label}" (${code}) berhasil ditambahkan.`);
}

async function toggleJalurStatus(id){
  const result = await apiRequest("/api/jalur");
  const jalur = (result.jalur||[]).find(j=>j.id===id);
  if(!jalur) return;
  if(!confirm(`${jalur.aktif ? "Nonaktifkan" : "Aktifkan"} jalur "${jalur.label}"?`)) return;

  await apiRequest("/api/jalur", {
    method:"PUT",
    body: JSON.stringify({ id, fields:{ aktif:!jalur.aktif } })
  });

  invalidateMasterCache();
  await loadJalurList();
}

let editingJalurId = null;

async function openEditModal(id){
  const result = await apiRequest("/api/jalur");
  const jalur = (result.jalur||[]).find(j=>j.id===id);
  if(!jalur) return;
  editingJalurId = id;
  document.getElementById("editLabel").value = jalur.label;
  document.getElementById("editCode").value = jalur.code;
  document.getElementById("modalEdit").classList.add("active");
}

function closeEditModal(){
  document.getElementById("modalEdit").classList.remove("active");
  editingJalurId = null;
}

async function saveEditJalur(){
  const label = document.getElementById("editLabel").value.trim();
  const code = document.getElementById("editCode").value.trim().toUpperCase();
  if(!label||!code){ alert("Nama dan kode jalur wajib diisi."); return; }

  const result = await apiRequest("/api/jalur");
  const dup = (result.jalur||[]).find(j=>j.code===code && j.id!==editingJalurId);
  if(dup){ alert(`Kode "${code}" sudah dipakai jalur lain.`); return; }

  await apiRequest("/api/jalur", {
    method:"PUT",
    body: JSON.stringify({ id:editingJalurId, fields:{ label, code } })
  });

  invalidateMasterCache();
  closeEditModal();
  await loadJalurList();
}

/* ── Generate Tower & Span ── */
let generatingJalurId = null;
let _genJalurCode = "";

async function openGenerateModal(jalurId){
  generatingJalurId = jalurId;
  const result = await apiRequest("/api/jalur");
  const jalur = (result.jalur||[]).find(j=>j.id===jalurId);
  if(!jalur) return;
  _genJalurCode = jalur.code;

  document.getElementById("genModalTitle").textContent = `Generate Tower & Span — ${jalur.code}`;
  document.getElementById("genModalSub").textContent =
    `Buat tower dan span massal untuk jalur ${jalur.label}. Data yang sudah ada tidak akan ditimpa.`;

  // Ambil data existing untuk prefill
  const [towers, spans] = await Promise.all([
    apiRequest("/api/tower?jalurId="+encodeURIComponent(jalurId)),
    apiRequest("/api/span?jalurId="+encodeURIComponent(jalurId))
  ]);
  const tNomors = (towers.tower||[]).map(t=>t.nomor).sort((a,b)=>a-b);
  const sNomors = (spans.span||[]).map(s=>s.nomor).sort((a,b)=>a-b);

  document.getElementById("genTowerDari").value   = tNomors.length ? tNomors[0] : 1;
  document.getElementById("genTowerSampai").value = tNomors.length ? tNomors[tNomors.length-1] : "";
  document.getElementById("genSpanDari").value    = sNomors.length ? sNomors[0] : 1;
  document.getElementById("genSpanSampai").value  = sNomors.length ? sNomors[sNomors.length-1] : "";

  await previewGenerate();
  document.getElementById("modalGenerate").classList.add("active");
}

function closeGenerateModal(){
  document.getElementById("modalGenerate").classList.remove("active");
  generatingJalurId = null;
}

async function previewGenerate(){
  const td=parseInt(document.getElementById("genTowerDari").value);
  const ts=parseInt(document.getElementById("genTowerSampai").value);
  const sd=parseInt(document.getElementById("genSpanDari").value);
  const ss=parseInt(document.getElementById("genSpanSampai").value);
  const c = _genJalurCode;

  const tRes = document.getElementById("genTowerResult");
  const sRes = document.getElementById("genSpanResult");

  if(!isNaN(td)&&!isNaN(ts)&&ts>=td){
    const count=ts-td+1;
    // Fetch existing untuk hitung new
    const existing = await apiRequest("/api/tower?jalurId="+encodeURIComponent(generatingJalurId));
    const existNomors = new Set((existing.tower||[]).map(t=>t.nomor));
    const newCount = Array.from({length:count},(_,i)=>td+i).filter(n=>!existNomors.has(n)).length;
    tRes.className="gen-result";
    tRes.textContent = `${count} tower (${c}-T${String(td).padStart(3,"0")} — ${c}-T${String(ts).padStart(3,"0")}) · ${newCount} baru`;
  } else {
    tRes.className="gen-result"+(td&&ts&&ts<td?" warn":"");
    tRes.textContent = td&&ts&&ts<td?"⚠ Nomor akhir harus ≥ nomor awal":"";
  }

  if(!isNaN(sd)&&!isNaN(ss)&&ss>=sd){
    const count=ss-sd+1;
    const existing = await apiRequest("/api/span?jalurId="+encodeURIComponent(generatingJalurId));
    const existNomors = new Set((existing.span||[]).map(s=>s.nomor));
    const newCount = Array.from({length:count},(_,i)=>sd+i).filter(n=>!existNomors.has(n)).length;
    sRes.className="gen-result";
    sRes.textContent = `${count} span (${c}-S${String(sd).padStart(3,"0")} — ${c}-S${String(ss).padStart(3,"0")}) · ${newCount} baru`;
  } else {
    sRes.className="gen-result"+(sd&&ss&&ss<sd?" warn":"");
    sRes.textContent = sd&&ss&&ss<sd?"⚠ Nomor akhir harus ≥ nomor awal":"";
  }
}

async function runGenerate(){
  const td=parseInt(document.getElementById("genTowerDari").value);
  const ts=parseInt(document.getElementById("genTowerSampai").value);
  const sd=parseInt(document.getElementById("genSpanDari").value);
  const ss=parseInt(document.getElementById("genSpanSampai").value);

  const hasTower=!isNaN(td)&&!isNaN(ts)&&ts>=td;
  const hasSpan=!isNaN(sd)&&!isNaN(ss)&&ss>=sd;
  if(!hasTower&&!hasSpan){ alert("Isi minimal satu range tower atau span."); return; }

  const saveBtn = document.getElementById("genSaveBtn");
  saveBtn.disabled=true; saveBtn.textContent="⏳ Memproses...";

  let towerAdded=0, spanAdded=0;

  if(hasTower){
    const r = await apiRequest("/api/tower?action=generate",{
      method:"POST",
      body:JSON.stringify({ jalurId:generatingJalurId, dari:td, sampai:ts })
    });
    if(r.success) towerAdded=r.added||0;
  }
  if(hasSpan){
    const r = await apiRequest("/api/span?action=generate",{
      method:"POST",
      body:JSON.stringify({ jalurId:generatingJalurId, dari:sd, sampai:ss })
    });
    if(r.success) spanAdded=r.added||0;
  }

  saveBtn.disabled=false; saveBtn.textContent="⚡ Generate Sekarang";

  invalidateMasterCache();
  closeGenerateModal();
  await loadJalurList(); // refresh tampilan dengan count terbaru
  alert(`✅ Selesai!\n• ${towerAdded} tower baru ditambahkan\n• ${spanAdded} span baru ditambahkan`);
}

initPage();
</script>
