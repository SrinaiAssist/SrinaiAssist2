<!DOCTYPE html>
<html lang="id">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#DED2AF">
<link rel="icon" href="/assets/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
<title>Scan Barcode — SRINAI ASSIST</title>
<script src="js/auth.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700;800&family=JetBrains+Mono:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js" defer></script>
<style>
:root{
  --paper:#F1EAD6;
  --paper-2:#E7DDC2;
  --paper-3:#DED2AF;
  --ink:#2B2A22;
  --ink-soft: rgba(43,42,34,0.62);
  --ink-faint: rgba(43,42,34,0.38);
  --route:#C1522A;
  --route-bg: rgba(193,82,42,0.1);
  --moss:#4F6B4A;
  --moss-bg: rgba(79,107,74,0.1);
  --line: rgba(43,42,34,0.18);
  --gold:#A8842E;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:'Inter',Arial,sans-serif;
  background:#0C0B08;
  color:var(--paper);
  -webkit-font-smoothing:antialiased;
}
.container{
  max-width:460px;margin:auto;min-height:100vh;
  position:relative;overflow-x:hidden;
  border-left:1px solid var(--line);border-right:1px solid var(--line);
  display:flex;flex-direction:column;
}

.topbar{
  position:relative;z-index:5;display:flex;align-items:center;gap:12px;
  padding:20px 18px 14px;background:var(--paper);color:var(--ink);
}
.back-btn{
  width:38px;height:38px;border-radius:12px;flex-shrink:0;
  background:var(--paper-2);border:1.5px solid var(--ink);
  display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;
}
.back-btn svg{width:18px;height:18px;stroke:var(--ink);}
.topbar-title{flex:1;min-width:0;}
.topbar-title .t1{font-family:'Bitter';font-weight:800;font-size:16px;}
.topbar-title .t2{font-family:'JetBrains Mono';font-size:9px;letter-spacing:0.6px;color:var(--ink-soft);text-transform:uppercase;margin-top:2px;}

.scan-stage{
  position:relative;flex:1;display:flex;align-items:center;justify-content:center;
  background:#000;overflow:hidden;
}
#scanVideo{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
}
.scan-overlay{
  position:relative;z-index:2;width:72%;max-width:280px;aspect-ratio:1/1;
}
.scan-frame{
  position:absolute;inset:0;border-radius:22px;
  box-shadow:0 0 0 2000px rgba(0,0,0,0.55);
}
.scan-corner{
  position:absolute;width:32px;height:32px;border-color:var(--gold);
  border-style:solid;border-width:0;
}
.scan-corner.tl{top:-2px;left:-2px;border-top-width:4px;border-left-width:4px;border-radius:22px 0 0 0;}
.scan-corner.tr{top:-2px;right:-2px;border-top-width:4px;border-right-width:4px;border-radius:0 22px 0 0;}
.scan-corner.bl{bottom:-2px;left:-2px;border-bottom-width:4px;border-left-width:4px;border-radius:0 0 0 22px;}
.scan-corner.br{bottom:-2px;right:-2px;border-bottom-width:4px;border-right-width:4px;border-radius:0 0 22px 0;}
.scan-line{
  position:absolute;left:6%;right:6%;height:2px;top:0;
  background:linear-gradient(90deg, transparent, var(--gold), transparent);
  animation:scanMove 2.1s ease-in-out infinite;
  box-shadow:0 0 10px 1px rgba(168,132,46,0.7);
}
@keyframes scanMove{
  0%{top:4%;} 50%{top:94%;} 100%{top:4%;}
}

.scan-hint{
  position:relative;z-index:2;text-align:center;padding:18px 24px 0;
  font-size:12.5px;color:rgba(241,234,214,0.85);line-height:1.5;
}

.scan-status{
  position:absolute;bottom:0;left:0;right:0;z-index:3;
  padding:16px 20px calc(20px + env(safe-area-inset-bottom));
  background:linear-gradient(0deg, rgba(0,0,0,0.75), transparent);
  text-align:center;font-family:'JetBrains Mono';font-size:11px;
  letter-spacing:0.4px;color:rgba(241,234,214,0.75);text-transform:uppercase;
}
.scan-status.err{color:#E9967A;}
.scan-status.ok{color:#9FD6A0;}

.perm-block{
  position:absolute;inset:0;z-index:6;background:var(--paper);color:var(--ink);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:32px;text-align:center;
}
.perm-block.show{display:flex;}
.perm-icon{
  width:64px;height:64px;border-radius:50%;border:2px solid var(--route);
  display:flex;align-items:center;justify-content:center;
}
.perm-icon svg{width:28px;height:28px;stroke:var(--route);}
.perm-title{font-family:'Bitter';font-weight:800;font-size:16px;}
.perm-desc{font-size:12.5px;color:var(--ink-soft);line-height:1.5;max-width:300px;}
.perm-retry{
  margin-top:6px;padding:10px 22px;border-radius:12px;border:1.5px solid var(--ink);
  background:var(--ink);color:var(--paper);font-weight:700;font-size:12.5px;cursor:pointer;
}

.result-toast{
  position:absolute;left:20px;right:20px;bottom:calc(88px + env(safe-area-inset-bottom));
  z-index:7;background:var(--paper);color:var(--ink);border-radius:16px;
  padding:14px 16px;display:none;align-items:center;gap:12px;
  box-shadow:0 10px 30px rgba(0,0,0,0.4);
}
.result-toast.show{display:flex;}
.result-icon{
  width:36px;height:36px;border-radius:50%;background:var(--moss-bg);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.result-icon svg{width:18px;height:18px;stroke:var(--moss);}
.result-text{flex:1;min-width:0;}
.result-text .r1{font-weight:700;font-size:12.5px;}
.result-text .r2{font-size:10.5px;color:var(--ink-soft);margin-top:2px;word-break:break-all;}
</style>
</head>
<body>
<div class="container">

  <div class="topbar">
    <a class="back-btn" href="javascript:void(0)" onclick="history.length>1?history.back():location.href='dashboard.html'" aria-label="Kembali">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div class="topbar-title">
      <div class="t1">Scan Barcode</div>
      <div class="t2">Arahkan kamera ke QR pada halaman</div>
    </div>
  </div>

  <div class="scan-stage" id="scanStage">
    <video id="scanVideo" autoplay playsinline muted></video>
    <div class="scan-overlay">
      <div class="scan-frame"></div>
      <div class="scan-corner tl"></div>
      <div class="scan-corner tr"></div>
      <div class="scan-corner bl"></div>
      <div class="scan-corner br"></div>
      <div class="scan-line"></div>
    </div>
    <div class="scan-status" id="scanStatus">Mencari kode...</div>

    <div class="result-toast" id="resultToast">
      <div class="result-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/></svg></div>
      <div class="result-text">
        <div class="r1" id="resultTitle">Kode ditemukan</div>
        <div class="r2" id="resultSub">Membuka halaman...</div>
      </div>
    </div>

    <div class="perm-block" id="permBlock">
      <div class="perm-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg></div>
      <div class="perm-title">Butuh Akses Kamera</div>
      <div class="perm-desc" id="permDesc">Izinkan akses kamera untuk memindai kode QR/Barcode.</div>
      <button class="perm-retry" id="permRetryBtn">Coba Lagi</button>
    </div>
  </div>

</div>

<canvas id="scanCanvas" style="display:none;"></canvas>

<script>
const video = document.getElementById("scanVideo");
const canvas = document.getElementById("scanCanvas");
const ctx = canvas.getContext("2d", { willReadFrequently: true });
const statusEl = document.getElementById("scanStatus");
const permBlock = document.getElementById("permBlock");
const permDesc = document.getElementById("permDesc");
const resultToast = document.getElementById("resultToast");
const resultSub = document.getElementById("resultSub");

let stream = null;
let rafId = null;
let locked = false; // mencegah scan berulang begitu kode ditemukan

async function startCamera(){
  permBlock.classList.remove("show");
  statusEl.textContent = "Mencari kode...";
  statusEl.className = "scan-status";
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    rafId = requestAnimationFrame(tick);
  }catch(e){
    console.warn("Kamera gagal diakses:", e);
    permDesc.textContent = (e && e.name === "NotAllowedError")
      ? "Akses kamera ditolak. Aktifkan izin kamera untuk situs ini di pengaturan browser, lalu coba lagi."
      : "Tidak bisa mengakses kamera perangkat. Pastikan tidak sedang dipakai aplikasi lain, lalu coba lagi.";
    permBlock.classList.add("show");
  }
}

function stopCamera(){
  if(rafId) cancelAnimationFrame(rafId);
  if(stream){
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
}

function tick(){
  if(locked){ return; }
  if(video.readyState === video.HAVE_ENOUGH_DATA && window.jsQR){
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = window.jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });
    if(code && code.data){
      handleDecoded(code.data.trim());
      return;
    }
  }
  rafId = requestAnimationFrame(tick);
}

function handleDecoded(text){
  if(locked || !text) return;
  locked = true;

  const isKnownLink = /informasi-span\.html|catatan-span\.html|catatan-tower\.html/i.test(text);
  const isSameOrigin = text.startsWith(location.origin) || /^https?:\/\//i.test(text) === false;

  if(isKnownLink || (isSameOrigin && text.startsWith(location.origin))){
    statusEl.textContent = "Kode dikenali";
    statusEl.className = "scan-status ok";
    resultSub.textContent = "Membuka halaman terkait...";
    resultToast.classList.add("show");
    if(navigator.vibrate) navigator.vibrate(60);
    stopCamera();
    setTimeout(() => { location.href = text; }, 550);
  } else if(/^https?:\/\//i.test(text)){
    // Link valid tapi bukan dari SRINAI ASSIST — tetap dibuka, beri peringatan singkat
    statusEl.textContent = "Kode ditemukan (link eksternal)";
    statusEl.className = "scan-status ok";
    resultSub.textContent = text;
    resultToast.classList.add("show");
    stopCamera();
    setTimeout(() => { location.href = text; }, 900);
  } else {
    statusEl.textContent = "Kode tidak dikenali, coba lagi";
    statusEl.className = "scan-status err";
    setTimeout(() => {
      locked = false;
      statusEl.textContent = "Mencari kode...";
      statusEl.className = "scan-status";
      rafId = requestAnimationFrame(tick);
    }, 1400);
  }
}

document.getElementById("permRetryBtn").addEventListener("click", startCamera);
document.addEventListener("visibilitychange", () => {
  if(document.hidden){ stopCamera(); }
  else if(!stream){ startCamera(); }
});

startCamera();
</script>
</body>
</html>
