<!DOCTYPE html>
<html lang="id">
<head>
  <meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0B0F10">
<link rel="icon" href="/assets/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
<title>CommandBot — SRINAI ASSIST (Terminal)</title>
<script src="js/auth.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0F10;
  --bg-2:#0E1315;
  --bg-3:#141B1D;
  --titlebar:#171D1F;
  --tab-active:#0B0F10;
  --border:#262E31;
  --fg:#D7DEE0;
  --fg-dim:#7C8A8F;
  --fg-faint:#4B565A;
  --green:#5FD068;
  --green-dim: rgba(95,208,104,0.55);
  --cyan:#63C9D8;
  --yellow:#E0B84C;
  --red:#E0605A;
  --magenta:#C792EA;
  --mono:'JetBrains Mono',Consolas,'Courier New',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:var(--mono);
  background:#000;
  color:var(--fg);
  -webkit-font-smoothing:antialiased;
}
.container{
  max-width:460px;margin:auto;height:100vh;display:flex;flex-direction:column;
  background:var(--bg);
  border-left:1px solid var(--border);border-right:1px solid var(--border);
  position:relative;overflow:hidden;
}
.hidden{display:none !important;}

/* ===== Title bar (Windows-Terminal style) ===== */
.term-titlebar{
  flex-shrink:0;background:var(--titlebar);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 6px;height:40px;gap:6px;
}
.term-tab{
  display:flex;align-items:center;gap:7px;background:var(--tab-active);
  height:32px;padding:0 12px 0 10px;border-radius:6px 6px 0 0;
  border:1px solid var(--border);border-bottom:none;
  flex:1;min-width:0;position:relative;top:1px;
}
.term-tab svg{flex-shrink:0;width:13px;height:13px;stroke:var(--green);}
.term-tab span{
  font-size:11.5px;font-weight:600;color:var(--fg);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;letter-spacing:.1px;
}
.term-controls{display:flex;align-items:center;gap:2px;flex-shrink:0;}
.term-ctrl-btn{
  width:28px;height:28px;border-radius:5px;background:transparent;border:none;
  color:var(--fg-dim);display:flex;align-items:center;justify-content:center;
  cursor:pointer;text-decoration:none;flex-shrink:0;
}
.term-ctrl-btn svg{width:13px;height:13px;}
.term-ctrl-btn:active{background:rgba(255,255,255,0.08);}
.term-ctrl-btn.close:active{background:var(--red);color:#fff;}
.term-ctrl-deco{opacity:.35;pointer-events:none;}
.term-ctrl-btn#minimizeBtn.active{color:var(--green);background:rgba(95,208,104,0.12);}

/* ===== Minimize: whole window shrinks into a small floating bar ===== */
.container.hidden-window{display:none;}
.minimized-bar{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
  display:flex;align-items:center;gap:8px;
  background:var(--titlebar);border:1px solid var(--border);border-radius:10px;
  padding:10px 12px 10px 14px;cursor:pointer;z-index:80;
  box-shadow:0 10px 28px rgba(0,0,0,0.55);
  font-family:var(--mono);color:var(--fg);
}
.minimized-bar svg{width:13px;height:13px;stroke:var(--green);flex-shrink:0;}
.minimized-bar span{font-size:11.5px;font-weight:700;letter-spacing:.2px;white-space:nowrap;}
.minimized-bar-restore{color:var(--fg-dim) !important;font-weight:400 !important;font-size:12px !important;margin-left:2px;}
.minimized-bar:active{background:var(--bg-3);}

/* ===== Command list modal (popup) ===== */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.62);z-index:90;
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.modal-overlay.hidden{display:none;}
.modal-box{
  width:100%;max-width:380px;max-height:72vh;display:flex;flex-direction:column;
  background:var(--bg-2);border:1px solid var(--border);border-radius:10px;overflow:hidden;
  box-shadow:0 20px 48px rgba(0,0,0,0.6);
}
.modal-header{
  flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
  padding:11px 8px 11px 14px;border-bottom:1px solid var(--border);background:var(--titlebar);
  font-size:11.5px;font-weight:700;color:var(--fg);letter-spacing:.2px;
}
.modal-body{flex:1;overflow-y:auto;padding:10px 10px 14px;}
.modal-body .term-menu-empty{padding:8px 4px;}

/* ===== Meta line (whoami / status) ===== */
.term-meta{
  flex-shrink:0;background:var(--bg-2);border-bottom:1px solid var(--border);
  padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.term-meta-txt{font-size:10.5px;color:var(--fg-dim);letter-spacing:.2px;}
.term-meta-txt b{color:var(--green);font-weight:700;}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 var(--green-dim);animation:livePulse 2s infinite;flex-shrink:0;}
@keyframes livePulse{
  0%{box-shadow:0 0 0 0 var(--green-dim);}
  70%{box-shadow:0 0 0 6px rgba(95,208,104,0);}
  100%{box-shadow:0 0 0 0 rgba(95,208,104,0);}
}

/* ===== Sync / boot status line ===== */
.sync-badge{
  flex-shrink:0;margin:0;padding:7px 14px;font-size:10.5px;line-height:1.5;
  border-bottom:1px solid var(--border);background:var(--bg-2);
  color:var(--yellow);display:flex;gap:7px;align-items:flex-start;
}
.sync-badge .tag{flex-shrink:0;font-weight:700;}
.sync-badge.connected{color:var(--green);}
.sync-badge.error{color:var(--red);}

/* ===== Terminal body ===== */
.chat-area{
  flex:1;overflow-y:auto;padding:10px 14px 12px;display:flex;flex-direction:column;gap:9px;
  background:
    repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 2px),
    var(--bg);
  font-size:12.5px;line-height:1.6;
}
.chat-area::-webkit-scrollbar{width:8px;}
.chat-area::-webkit-scrollbar-track{background:var(--bg);}
.chat-area::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

.term-row{width:100%;}
.term-line-in{color:var(--fg);word-wrap:break-word;}
.ps1-user{color:var(--green);font-weight:700;}
.ps1-sep{color:var(--fg-dim);}
.ps1-path{color:var(--cyan);font-weight:700;}
.term-cmd{color:#F4F7F8;font-weight:600;}

.term-line-out{
  color:var(--fg);white-space:pre-wrap;word-wrap:break-word;
  padding-left:12px;border-left:2px solid var(--border);
}
.term-line-out b{color:var(--cyan);}
.term-line-out a{color:var(--green);font-weight:700;text-decoration:underline;}
.term-line-out.is-error{border-left-color:var(--red);color:#F2C6C3;}
.term-line-out.is-error b{color:var(--red);}
.term-line-out.is-typing::after{
  content:"";display:inline-block;width:6px;height:12px;margin-left:2px;
  background:var(--green);vertical-align:middle;animation:cursorBlink .8s steps(1) infinite;
}

.term-bot-tag{color:var(--fg-faint);font-size:10px;margin-bottom:2px;letter-spacing:.3px;}

.term-time{color:var(--fg-faint);font-size:9.5px;margin-left:8px;}

/* typing indicator */
.term-typing{padding-left:12px;border-left:2px solid var(--border);color:var(--fg-dim);display:flex;align-items:center;gap:5px;}
.term-cursor-blink{display:inline-block;width:7px;height:13px;background:var(--green);animation:cursorBlink 1s steps(1) infinite;}
@keyframes cursorBlink{0%,49%{opacity:1;}50%,100%{opacity:0;}}

/* menu list (numbered commands rendered like ls output) */
.term-menu{margin-top:6px;display:flex;flex-direction:column;gap:2px;}
.term-menu-item{
  display:flex;align-items:baseline;gap:8px;padding:6px 8px;border-radius:3px;
  cursor:pointer;background:transparent;border:1px solid transparent;text-align:left;
  font-family:var(--mono);color:var(--fg);width:100%;
}
.term-menu-item:active{background:rgba(95,208,104,0.1);border-color:var(--border);}
.term-menu-num{color:var(--cyan);font-weight:700;flex-shrink:0;}
.term-menu-txt{font-size:12px;color:var(--fg);}
.term-menu-empty{color:var(--fg-dim);font-style:italic;font-size:12px;padding:4px 0;}

/* ===== Input area (prompt line) ===== */
.input-area{
  flex-shrink:0;background:var(--bg-2);padding:9px 12px 10px;border-top:1px solid var(--border);
}
.input-row{display:flex;align-items:flex-end;gap:6px;}
.term-prompt-static{
  flex-shrink:0;font-size:12.5px;font-weight:700;color:var(--green);padding:9px 0;white-space:nowrap;
}
.text-input-wrap{flex:1;background:transparent;display:flex;align-items:flex-end;min-width:0;}
textarea{
  flex:1;background:transparent;border:none;color:var(--fg);font-family:var(--mono);
  font-size:12.5px;padding:9px 4px;resize:none;max-height:100px;outline:none;caret-color:var(--green);
}
textarea::placeholder{color:var(--fg-faint);}
.send-btn{
  width:34px;height:34px;border-radius:5px;background:var(--bg-3);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:transform .1s, background .1s;
  color:var(--green);
}
.send-btn:active{transform:scale(.9);background:rgba(95,208,104,0.12);}
.send-btn:disabled{opacity:.4;cursor:not-allowed;}
.hint-row{font-size:9.5px;color:var(--fg-faint);margin-top:8px;padding:0 2px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.cancel-btn{
  flex-shrink:0;background:transparent;border:1px solid var(--red);color:var(--red);
  font-family:var(--mono);font-size:9.5px;font-weight:700;padding:4px 8px;border-radius:4px;cursor:pointer;
}
.cancel-btn:active{background:rgba(224,96,90,0.15);}
</style>
</head>
<body>

<div class="container">

  <div class="term-titlebar">
    <div class="term-tab">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
      <span id="tabTitle">srinai@COMMANDBOT: ~</span>
    </div>
    <div class="term-controls">
      <button class="term-ctrl-btn" id="minimizeBtn" onclick="toggleMinimize()" title="Minimize">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <button class="term-ctrl-btn" onclick="openCmdModal()" title="Daftar command aktif">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>
      </button>
      <a href="dashboard.html" class="term-ctrl-btn close" title="Tutup">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
      </a>
    </div>
  </div>

  <div class="term-meta">
    <span class="term-meta-txt" id="userInfo"></span>
    <span class="live-dot"></span>
  </div>

  <div class="sync-badge" id="syncBadge">
    <span class="tag">[*]</span>
    <span>Menyambungkan ke Ruang Kerja SrinAI...</span>
  </div>

  <div id="chatArea" class="chat-area"></div>

  <div class="input-area">
    <div class="input-row">
      <span class="term-prompt-static" id="inputPrompt">$</span>
      <div class="text-input-wrap">
        <textarea id="message" placeholder="Ketik nomor atau command... misal: 1" rows="1" oninput="autoGrow(this)"></textarea>
      </div>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="13 6 19 12 13 18"/></svg>
      </button>
    </div>
    <div class="hint-row">
      <span># ketik "menu" kapan saja untuk lihat daftar ulang</span>
      <button class="cancel-btn" type="button" onclick="cancelFlow()">[ESC] Batal</button>
    </div>
  </div>

</div>

<button class="minimized-bar hidden" id="minimizedBar" onclick="toggleMinimize()">
  <svg viewBox="0 0 24 24" fill="none" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
  <span id="minimizedBarLabel">COMMANDBOT</span>
  <span class="minimized-bar-restore">▢</span>
</button>

<div class="modal-overlay hidden" id="cmdModalOverlay" onclick="closeCmdModal()">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span>Daftar Command Aktif</span>
      <button class="term-ctrl-btn close" onclick="closeCmdModal()" title="Tutup">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
      </button>
    </div>
    <div class="modal-body" id="cmdModalBody"></div>
  </div>
</div>

<script>
let currentUser, currentRole, consoleChatId;

/*
 * Sama seperti command-bot.html (tema klasik): daftar command diambil live dari
 * /api/settings?action=botCommands, difilter yang status-nya "live" di Botlab.
 * Balasan tiap command diambil live dari /api/settings?action=botConsole
 * (dikirim ke bot Telegram/Botlab, bukan simulasi).
 */
let botCommands = [];

const GREETING_INTRO = "Halo! Data apa yang mau kamu cek atau kerjakan? Balas dengan angkanya:";
const BOT_NAME = "bot";

async function initPage(){
  if(!(await isLoggedIn())){
    location.href = "index.html";
    return;
  }

  currentUser = getCurrentUser();
  currentRole = getCurrentRole();
  document.getElementById("userInfo").innerHTML = `<b>${escapeHtml(currentUser)}</b> · role: ${escapeHtml(currentRole.toUpperCase())} · sesi aktif`;
  document.getElementById("tabTitle").textContent = `${currentUser}@COMMANDBOT: ~`;
  document.getElementById("minimizedBarLabel").textContent = `${currentUser}@COMMANDBOT`;
  document.getElementById("inputPrompt").textContent = `${currentUser}@srinai:~$`;
  consoleChatId = "web:" + currentUser;

  await loadCommands();
  startIdleWatcher();
  await loadDailyRecap();
}

/*
 * TAHAP 3 — RESET OTOMATIS SESI IDLE + REKAP HARIAN + NOTIF BELUM TERBACA
 *
 * 1) Reset idle: kalau tidak ada aktivitas (ketik/kirim) selama 30 menit,
 *    kirim "/batal" diam-diam ke Botlab supaya sesi command multi-langkah
 *    (mis. /catatan yang lagi nunggu balasan) ikut direset di server --
 *    jadi tidak nyangkut kalau user balik lagi nanti.
 * 2) Rekap harian: setiap kali halaman ini dibuka, tanya /api/settings?action=botNotify
 *    apakah ada notif belum terbaca untuk user ini. Notif jenis
 *    "span_belum_tegakan" (dibuat oleh cron harian, lihat vercel.json +
 *    api/settings.js) ditampilkan sebagai pesan bot otomatis berisi
 *    daftar span yang belum ada tegakannya + link langsung ke
 *    catatan-span.html buat bikin tegakan baru.
 * 3) Setelah rekap ditampilkan, notif ditandai terbaca -- ini juga yang
 *    menghentikan getar ikon CommandBot di dashboard.html.
 */
let lastActivityAt = Date.now();
let idleResetTriggered = false;
const IDLE_LIMIT_MS = 30 * 60 * 1000; // 30 menit

function markActivity(){
  lastActivityAt = Date.now();
  idleResetTriggered = false;
}

function startIdleWatcher(){
  setInterval(async () => {
    if(idleResetTriggered) return;
    if(Date.now() - lastActivityAt >= IDLE_LIMIT_MS){
      idleResetTriggered = true;
      await autoResetIdleSession();
    }
  }, 30 * 1000); // cek tiap 30 detik, cukup presisi untuk batas 30 menit
}

async function autoResetIdleSession(){
  try {
    await apiRequest("/api/settings?action=botConsole", {
      method: "POST",
      body: JSON.stringify({ text: "/batal", chatId: consoleChatId, username: currentUser }),
    });
  } catch(e){ /* diamkan -- reset idle tidak boleh ganggu UX kalau gagal */ }
  addBotRow("⏱️ Sesi kamu direset otomatis karena tidak ada aktivitas selama 30 menit. Ketik <b>menu</b> kalau mau mulai lagi.");
}

async function loadDailyRecap(){
  const result = await apiRequest("/api/settings?action=botNotify&username=" + encodeURIComponent(currentUser), { method: "GET" });
  if(!result.success || !result.notifications || result.notifications.length === 0) return;

  const recap = result.notifications.find(n => n.type === "span_belum_tegakan");
  const spans = recap && recap.payload && recap.payload.spans || [];

  if(spans.length > 0){
    const list = spans.map(s =>
      `• ${escapeHtml(jalurLabel(s.jalurId))} — Span #${s.nomor} ` +
      `<a href="catatan-span.html?span=${encodeURIComponent(s.id)}">Buat tegakan →</a>`
    ).join("<br>");
    addBotRow(
      `📋 <b>Rekap harian</b> — kamu punya <b>${spans.length}</b> span yang belum ada tegakannya:<br><br>${list}` +
      `<br><br>Yuk lengkapi tegakannya biar datanya rapi 🙌`
    );
  }

  // Tandai semua notif user ini sudah dibaca (juga menghentikan getar
  // ikon CommandBot di dashboard untuk kunjungan berikutnya).
  await apiRequest("/api/settings?action=botNotifyRead", {
    method: "POST",
    body: JSON.stringify({ username: currentUser }),
  });
}

async function loadCommands(){
  const badge = document.getElementById("syncBadge");
  const result = await apiRequest("/api/settings?action=botCommands", { method: "GET" });

  if(!result.success){
    botCommands = [];
    badge.className = "sync-badge error";
    badge.innerHTML =
      `<span class="tag">[ERR]</span>` +
      `<span>Gagal sinkron ke Ruang Kerja SrinAI: ${escapeHtml(result.message || "kesalahan tidak diketahui")}. Kamu masih bisa ketik command, tapi menu nomor di bawah belum bisa dimuat.</span>`;
    return;
  }

  botCommands = (result.commands || []).filter(c => c.status === "live");
  badge.className = "sync-badge connected";
  badge.innerHTML =
    `<span class="tag">[OK]</span>` +
    `<span>Tersambung ke Ruang Kerja SrinAI — ${botCommands.length} command live siap dipakai. Balasan diambil langsung dari Botlab.</span>`;
}

function getTimeLabel(){
  return new Date().toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});
}

function autoGrow(el){
  markActivity();
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 100) + "px";
}

let isMinimized = false;
function toggleMinimize(){
  isMinimized = !isMinimized;
  document.querySelector(".container").classList.toggle("hidden-window", isMinimized);
  document.getElementById("minimizedBar").classList.toggle("hidden", !isMinimized);
}

function openCmdModal(){
  const body = document.getElementById("cmdModalBody");
  body.innerHTML = menuChipsHtml();
  document.getElementById("cmdModalOverlay").classList.remove("hidden");
}
function closeCmdModal(){
  document.getElementById("cmdModalOverlay").classList.add("hidden");
}

function scrollToBottom(){
  const area = document.getElementById("chatArea");
  area.scrollTop = area.scrollHeight;
}

function htmlToPlainText(html){
  const div = document.createElement("div");
  div.innerHTML = html.replace(/<br\s*\/?>/gi, "\n");
  return div.textContent || "";
}

function typeWriterEffect(el, finalHtml){
  const plainText = htmlToPlainText(finalHtml);
  const total = plainText.length;
  if(total === 0){ el.innerHTML = finalHtml; return; }

  el.textContent = "";
  el.classList.add("is-typing");

  const intervalMs = 12;
  const chunk = Math.max(1, Math.ceil(total / 55)); // selesai ketik cepat (~0.6-0.8s) walau teks panjang
  let i = 0;

  function tick(){
    i += chunk;
    el.textContent = plainText.slice(0, i);
    scrollToBottom();
    if(i < total){
      setTimeout(tick, intervalMs);
    } else {
      el.classList.remove("is-typing");
      el.innerHTML = finalHtml; // pulihkan format asli (bold, link, tombol command)
      scrollToBottom();
    }
  }
  tick();
}

function addBotRow(html){
  const area = document.getElementById("chatArea");
  const row = document.createElement("div");
  row.className = "term-row";
  row.innerHTML = `
    <div class="term-bot-tag">${BOT_NAME} — ${getTimeLabel()}</div>
    <div class="term-line-out"></div>`;
  area.appendChild(row);
  typeWriterEffect(row.querySelector(".term-line-out"), html);
  scrollToBottom();
}

function addMyRow(text){
  const area = document.getElementById("chatArea");
  const row = document.createElement("div");
  row.className = "term-row";
  row.innerHTML = `
    <div class="term-line-in"><span class="ps1-user">${escapeHtml(currentUser || "user")}</span><span class="ps1-sep">@srinai</span><span class="ps1-sep">:</span><span class="ps1-path">~</span><span class="ps1-sep">$</span> <span class="term-cmd">${escapeHtml(text)}</span></div>`;
  area.appendChild(row);
  scrollToBottom();
}

function menuChipsHtml(){
  if(botCommands.length === 0){
    return `<div class="term-menu"><div class="term-menu-empty">// belum ada command live dari Ruang Kerja SrinAI saat ini.</div></div>`;
  }
  return `<div class="term-menu">` + botCommands.map((c, i) =>
    `<button class="term-menu-item" onclick="pickNumber(${i + 1})">
      <span class="term-menu-num">[${i + 1}]</span><span class="term-menu-txt">${escapeHtml(c.name || c.description || c.triggerText)}</span>
    </button>`
  ).join("") + `</div>`;
}

function showMenu(asReply){
  if(!asReply){
    addBotRow(escapeHtml(GREETING_INTRO) + menuChipsHtml());
  } else {
    addBotRow("Ini daftar command yang ada sekarang:" + menuChipsHtml());
  }
}

function showTyping(){
  const area = document.getElementById("chatArea");
  const row = document.createElement("div");
  row.className = "term-row";
  row.id = "botTypingIndicator";
  row.innerHTML = `
    <div class="term-bot-tag">${BOT_NAME} — mengetik</div>
    <div class="term-typing">memproses<span class="term-cursor-blink"></span></div>`;
  area.appendChild(row);
  scrollToBottom();
}
function removeTyping(){
  const el = document.getElementById("botTypingIndicator");
  if(el) el.remove();
}

function cancelFlow(){
  document.getElementById("message").value = "/batal";
  sendMessage();
}

function pickNumber(n){
  const cmd = botCommands[n - 1];
  document.getElementById("message").value = cmd ? (cmd.triggerText || String(n)) : String(n);
  closeCmdModal();
  sendMessage();
}

async function sendMessage(){
  markActivity();
  const input = document.getElementById("message");
  const text = input.value.trim();
  if(!text) return;

  addMyRow(text);
  input.value = "";
  autoGrow(input);

  const lower = text.toLowerCase();
  if(lower === "menu" || lower === "help" || lower === "bantuan"){
    showMenu(true);
    return;
  }

  const sendBtn = document.getElementById("sendBtn");
  sendBtn.disabled = true;
  showTyping();

  const result = await apiRequest("/api/settings?action=botConsole", {
    method: "POST",
    body: JSON.stringify({ text, chatId: consoleChatId, username: currentUser }),
  });

  removeTyping();

  if(!result.success){
    addBotRow(
      `⚠️ Gagal menghubungi Botlab: ${escapeHtml(result.message || "kesalahan tidak diketahui")}.<br>` +
      `Coba lagi, atau ketik <b>menu</b> untuk lihat daftar command.`
    );
    const lastOut = document.querySelector("#chatArea .term-row:last-child .term-line-out");
    if(lastOut) lastOut.classList.add("is-error");
  } else {
    addBotRow(escapeHtml(result.replyText || "(tidak ada balasan dari bot)"));
  }

  sendBtn.disabled = false;
}

function escapeHtml(str){
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

document.getElementById("message").addEventListener("keydown", function(e){
  if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});

initPage();
</script>
